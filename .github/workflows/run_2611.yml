name: Run 2611 GDS generation

on:
  push:

jobs:
  run-2611:
    if: github.event.head_commit.message == 'Run 2611 GDS generation'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax check
        run: python -m py_compile 2611_tapered_yue_dual_resist.py
      - name: Install public Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install gdsfactory numpy
      - name: Preflight copied repository
        run: |
          echo "Repository root:"
          pwd
          echo "Checking expected custom dependencies..."
          test -e layout/core/__init__.py || echo "MISSING: layout/core/__init__.py"
          test -e layout/core/layers.py || echo "MISSING: layout/core/layers.py"
          test -e layout/core/markers.py || echo "MISSING: layout/core/markers.py"
          test -e layout/acoustics/phononics.py || echo "MISSING: layout/acoustics/phononics.py"
          test -e gds/tether_variants.gds || echo "MISSING: gds/tether_variants.gds"
      - name: Run layout generator
        run: |
          mkdir -p gds
          python 2611_tapered_yue_dual_resist.py
      - name: Commit generated GDS
        if: success()
        run: |
          git config user.name "chatgpt-runner"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gds/*.gds
          if git diff --cached --quiet; then
            echo "No new GDS file to commit."
          else
            git commit -m "Generate 2611 tapered dual-resist GDS"
            git push
          fi
