name: Verify all coupler release masks
on:
  push:
    branches: [layout/2611-L6000-all-coupler-windows]
    paths: [.github/workflows/verify_2611_all_coupler_windows.yml]
jobs:
  verify:
    if: github.event.head_commit.message == 'Build all-coupler masks with 1 um L14 expansion'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Preserve comparison and hash unrelated tracked files
        run: |
          mkdir -p baseline
          cp gds/2611_design1_L6000_P10_straight_output_comparison.gds baseline/comparison.gds
          cp 2611_design1_L6000_straight_output.py baseline/builder.py
          python - <<'PY'
          import subprocess,hashlib,json
          from pathlib import Path
          base='35ac1ebe3205e57c157b369b23cdab73d765b71b'
          paths=subprocess.check_output(['git','ls-tree','-r','--name-only',base],text=True).splitlines()
          mutable={'2611_design1_L6000_straight_output.py','DESIGN1_STRAIGHT_OUTPUT_README.txt','validate_2611_straight_output_raw.py','validate_2611_two_coupler_windows.py','gds/2611_design1_L6000_P10_straight_output_comparison.gds','gds/2611_design1_L6000_P10_straight_output_comparison.json','gds/2611_layer_cleanup_validation.json','gds/2611_straight_output_raw_validation.json','gds/2611_two_coupler_windows_validation.json'}
          protected={p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in paths if p not in mutable}
          Path('baseline/protected.json').write_text(json.dumps(protected))
          PY
      - name: Apply isolated comparison-builder update
        run: python _update_all_coupler_windows.py
      - name: Install approved long-layout engine
        run: python -m pip install gdsfactory==9.45.0 klayout==0.30.13 numpy==2.4.6 shapely matplotlib
      - name: Build all six devices with the new final masks
        run: python 2611_design1_L6000_straight_output.py
      - name: Independently measure masks margins and unchanged optical paths
        run: python validate_2611_coupler_release.py --baseline baseline/comparison.gds --render
      - name: Update current documentation and compatibility validators
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast,hashlib,json
          readme='''DESIGN 1 L6000: CURRENT SIX-DEVICE COMPARISON
          =============================================
          Run: python 2611_design1_L6000_straight_output.py
          Output: gds/2611_design1_L6000_P10_straight_output_comparison.gds

          Bottom three: two couplers, ridge widths 1.62 / 1.64 / 1.68 um.
          Top three: tapered input and 2000 um constant-width straight output.
          Each meander straight is 6000 um. Y pitch stays 600 um. All placements,
          optical tapers, waveguides, support islands and alignment tips are retained.

          CURRENT FINAL-EXPORT POLICY (BOTH SETS)
          Layers 11, 16 and 51 are removed, every datatype in every cell.
          Both Layer 2 and Layer 14 release masks begin at the actual Layer-10
          entrance and extend outward through the existing terminal assemblies.
          Two-coupler devices retain two windows; straight-output devices retain
          only their tapered input window. No mask remains along the meander,
          preceding transition, bends, or taper-free 2000 um output extension.
          The straight output ridge itself is unchanged on Layer 15.

          Layer 14 ONLY uses LAYER14_WINDOW_MARGIN = 1.0 um, instead of 3.0.
          It is rebuilt using the original smooth mask construction with an
          isolated margin setting. The broad first-stage entrance still joins
          the inherited band and narrows smoothly into the 1 um-expanded taper.
          Long channel and pad definitions are unchanged. Intersection with the
          approved mask prevents any widening. Layer 2 is only cropped, not
          resized. Its surviving terminal polygons are unchanged.

          Labels remain on Layer 2, global alignment markers on Layer 15,
          and Layer-10 markers and the frame remain unchanged. P10 in the
          preserved labels is a legacy identifier; there are no exported PNCs.
          Controls are in Section 01. Intermediate worker masks still contain
          construction layers for baseline checks; only the final GDS is the
          deliverable. Existing standalone designs, 18-device sweep and the
          original three-device source GDS are NOT modified.

          Current independent audit:
          python validate_2611_coupler_release.py --render
          Add --baseline PATH for before/after preservation checks.
          Report: gds/2611_coupler_release_validation.json
          Old raw/two-coupler validator entrypoints delegate to this audit.
          Geometry checks do not establish optical loss, mechanical stability,
          or full fabrication-rule compliance.

          Engine: Python 3.11, gdsfactory 9.45.0, KLayout 0.30.13, NumPy 2.4.6.
          Keep the source width-sweep GDS/manifest, two source builders, local
          support modules and tether_variants.gds in the Cading directory.
          '''
          import textwrap
          Path('DESIGN1_STRAIGHT_OUTPUT_README.txt').write_text(textwrap.dedent(readme))
          raw=Path('validate_2611_straight_output_raw.py');s=raw.read_text()
          a=s.index('def main(root):');b=s.index("if __name__",a)
          s=s[:a]+"def main(root):\n    from validate_2611_coupler_release import validate\n    validate(Path(root))\n\n\n"+s[b:]
          ast.parse(s);raw.write_text(s)
          Path('validate_2611_two_coupler_windows.py').write_text('''"""Compatibility entrypoint: both device sets now use terminal-only masks."""
          import argparse
          from pathlib import Path
          from validate_2611_coupler_release import validate, render
          if __name__ == '__main__':
              p=argparse.ArgumentParser(description=__doc__)
              p.add_argument('--root',type=Path,default=Path(__file__).resolve().parent)
              p.add_argument('--baseline',type=Path)
              p.add_argument('--render',action='store_true')
              a=p.parse_args();validate(a.root,a.baseline)
              if a.render:render(a.root)
          '''.replace('\n          ','\n'))
          for name in ['2611_two_coupler_windows_validation.json','2611_straight_output_raw_validation.json','2611_layer_cleanup_validation.json']:
              Path('gds',name).write_text(json.dumps({'status':'SUPERSEDED','current_report':'gds/2611_coupler_release_validation.json','reason':'Both sets now omit L11 and retain L2/L14 only at couplers; L14 margin is 1 um.'},indent=2))
          for fn in ['2611_design1_L6000_straight_output.py','validate_2611_coupler_release.py','validate_2611_straight_output_raw.py','validate_2611_two_coupler_windows.py']:
              ast.parse(Path(fn).read_text())
          protected=json.loads(Path('baseline/protected.json').read_text())
          for name,sha in protected.items():assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==sha,name
          p=Path('gds/2611_coupler_release_validation.json');r=json.loads(p.read_text())
          r.update(base_commit='35ac1ebe3205e57c157b369b23cdab73d765b71b',protected_unrelated_file_count=len(protected),unrelated_files_unchanged=True)
          p.write_text(json.dumps(r,indent=2))
          print('All',len(protected),'unrelated files unchanged')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 2611-L6000-all-coupler-release
          path: |
            2611_design1_L6000_straight_output.py
            DESIGN1_STRAIGHT_OUTPUT_README.txt
            validate_2611_coupler_release.py
            validate_2611_straight_output_raw.py
            validate_2611_two_coupler_windows.py
            gds/2611_design1_L6000_P10_straight_output_comparison.*
            gds/2611_coupler_release_validation.json
            gds/2611_straight_output_raw_validation.json
            gds/2611_two_coupler_windows_validation.json
            gds/2611_layer_cleanup_validation.json
            validation_2611_coupler_release/
            validation_2611_straight_output/
      - name: Save only validated changes and remove temporary runner
        run: |
          git config user.name "chatgpt-runner"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 2611_design1_L6000_straight_output.py DESIGN1_STRAIGHT_OUTPUT_README.txt validate_2611_coupler_release.py validate_2611_straight_output_raw.py validate_2611_two_coupler_windows.py gds/2611_design1_L6000_P10_straight_output_comparison.gds gds/2611_design1_L6000_P10_straight_output_comparison.json gds/2611_coupler_release_validation.json gds/2611_straight_output_raw_validation.json gds/2611_two_coupler_windows_validation.json gds/2611_layer_cleanup_validation.json
          git rm _update_all_coupler_windows.py .github/workflows/verify_2611_all_coupler_windows.yml
          git commit -m "Save terminal-only masks for both coupler sets and 1 um L14 expansion"
          git push
