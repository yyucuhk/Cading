name: Verify saved original 15-to-5 taper profiles
on:
  push:
    branches: [layout/2611-original-taper-15to5]
    paths: [.github/workflows/verify_2611_original_profile.yml]
jobs:
  verify:
    if: github.event.head_commit.message == 'Build restored original taper profiles'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Preserve current and original-profile baselines
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil, subprocess, json, hashlib
          root=Path('validation_2611_original_profile')
          names=['2611_tapered_yue_dual_resist_L10_L12.gds','2611_tapered_yue_design2.gds','2611_design1_design2_L1400_18device_sweep.gds','2611_design1_L6000_P10_width_sweep.gds']
          for folder in ['baseline','original3']:(root/folder).mkdir(parents=True,exist_ok=True)
          for name in names:
              shutil.copy2(Path('gds')/name,root/'baseline'/name)
              (root/'original3'/name).write_bytes(subprocess.check_output(['git','show','6d4fcb56e649e80e0270c3af37be16a102799c00:gds/'+name]))
          support=['tapered_local.py','layers.py','markers.py','phononics.py','tether_variants.py','tether_variants.gds','extract_layer2_gdsfactory.py','text.py']
          (root/'support_hashes.json').write_text(json.dumps({p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in support},indent=2))
          PY
      - name: Restore original functions and update superseded length assertion
        run: |
          python _restore_original_taper.py
          python - <<'PY'
          from pathlib import Path
          p=Path('validate_2611_straight_pitch.py');s=p.read_text()
          old="abs(entry['pnc_taper_length_um']-31.378626347)<1e-6"
          assert s.count(old)==1
          p.write_text(s.replace(old,"abs(entry['pnc_taper_length_um']-45.0)<1e-9"))
          PY
      - name: Retrieve already generated layouts without regenerating geometry
        uses: actions/download-artifact@v4
        with:
          name: 2611-original-profile-release
          run-id: 42437243253
          github-token: ${{ github.token }}
          path: /tmp/original-profile-built
      - name: Verify source identity and restore generated GDS bytes
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,shutil,json
          source=Path('/tmp/original-profile-built')
          for f in ['2611_tapered_yue_dual_resist.py','2611_tapered_yue_design2.py','2611_build_combined_sweep.py','2611_design1_L6000_P10_width_sweep.py']:
              assert Path(f).read_bytes()==(source/f).read_bytes(),f
          for pattern in ['2611_tapered_yue_dual_resist_L10_L12.gds','2611_tapered_yue_design2.gds','2611_design1_design2_L1400_18device_sweep.*','2611_design1_L6000_P10_width_sweep.*']:
              for p in (source/'gds').glob(pattern):shutil.copy2(p,Path('gds')/p.name)
          hashes={p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in Path('gds').glob('*.gds')}
          Path('validation_2611_original_profile/generated_hashes.json').write_text(json.dumps(hashes,indent=2))
          PY
      - name: Install geometry inspection engine
        run: python -m pip install gdsfactory==9.45.0 kfactory==2.6.1 klayout==0.30.13 numpy==2.4.6
      - name: Verify connectivity complete ends labels placement and pitches
        run: |
          python validate_2611_combined_sweep.py
          python validate_2611_vertical_sweep.py
          python validate_2611_straight_pitch.py
          python validate_2611_pnc5um.py
      - name: Measure original profiles and compare all devices to original layout
        run: python validate_2611_original_profile.py
      - name: Finalize reports and prove saved GDS bytes and support libraries are unchanged
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('validation_2611_original_profile')
          for p,h in json.loads((root/'support_hashes.json').read_text()).items():
              assert hashlib.sha256(Path(p).read_bytes()).hexdigest()==h,p
          for p,h in json.loads((root/'generated_hashes.json').read_text()).items():
              assert hashlib.sha256((Path('gds')/p).read_bytes()).hexdigest()==h,p
          p=Path('gds/2611_original_profile_validation.json');r=json.loads(p.read_text())
          assert r['status']=='PASS' and not r['failures']
          r['support_libraries_unchanged']=True;r['GDS_bytes_unchanged_during_final_checks']=True
          r['generation_run_id']=42437243253
          r['build_engine_versions']={'gdsfactory':'9.45.0','kfactory':'2.6.1','numpy':'2.4.6','short_klayout':'0.30.12','long_klayout':'0.30.13'}
          p.write_text(json.dumps(r,indent=2));(root/'validation_report.json').write_text(p.read_text())
          Path('gds/2611_smooth_junction_validation.json').write_text(json.dumps({'status':'SUPERSEDED','current_report':'2611_original_profile_validation.json','reason':'Original zero-end-derivative full-length taper law replaces nonzero-slope Hermite matching.'},indent=2))
          PY
      - name: Upload checked code GDS files and measured previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 2611-original-profile-final
          path: |
            *.py
            *.md
            PNC5UM_README.txt
            ORIGINAL_TAPER_PROFILE_README.txt
            tether_variants.gds
            gds/2611_tapered_yue_dual_resist_L10_L12.gds
            gds/2611_tapered_yue_design2.gds
            gds/2611_design1_design2_L1400_18device_sweep.*
            gds/2611_design1_L6000_P10_width_sweep.*
            gds/2611_original_profile_validation.json
            gds/2611_combined_sweep_validation.json
            gds/2611_vertical_sweep_validation.json
            gds/2611_straight_pitch_validation.json
            gds/2611_pnc5um_validation.json
            gds/2611_smooth_junction_validation.json
            validation_2611_original_profile/*.json
            validation_2611_original_profile/*.png
          if-no-files-found: error
      - name: Commit passing source and output; remove temporary runner
        run: |
          git config user.name 'chatgpt-runner'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 2611_tapered_yue_dual_resist.py 2611_tapered_yue_design2.py 2611_build_combined_sweep.py 2611_design1_L6000_P10_width_sweep.py
          git add validate_2611_pnc5um.py validate_2611_smooth_junction.py validate_2611_original_profile.py validate_2611_straight_pitch.py
          git add CAD_EDITING_GUIDE.md COMBINED_SWEEP_README.md DESIGN1_L6000_WIDTH_SWEEP_README.md PNC5UM_README.txt SMOOTH_5UM_JUNCTION_README.md ORIGINAL_TAPER_PROFILE_README.txt
          git add gds/2611_tapered_yue_dual_resist_L10_L12.gds gds/2611_tapered_yue_design2.gds gds/2611_design1_design2_L1400_18device_sweep.* gds/2611_design1_L6000_P10_width_sweep.* gds/2611_*validation.json
          git rm _restore_original_taper.py .github/workflows/verify_2611_original_profile.yml
          git commit -m 'Restore original full-length 15-to-5 and downstream taper profiles; save verified GDS files'
          git push
