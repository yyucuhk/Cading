name: Build and verify all-coupler masks with approved baseline
on:
  push:
    branches: [layout/2611-L6000-all-coupler-windows]
    paths: [.github/workflows/build_2611_all_coupler_final.yml]
jobs:
  verify:
    if: github.event.head_commit.message == 'Fetch the approved baseline and run all-coupler mask verification'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch exact approved baseline
        run: git fetch origin 35ac1ebe3205e57c157b369b23cdab73d765b71b --depth=1
      - name: Run the unchanged guarded build and validation steps
        run: |
          python -m pip install PyYAML
          python - <<'PY'
          from pathlib import Path
          import subprocess,yaml
          source=Path('.github/workflows/verify_2611_all_coupler_windows.yml')
          steps=yaml.safe_load(source.read_text())['jobs']['verify']['steps']
          for step in steps:
              if 'run' not in step or step['name'].startswith('Save only'):continue
              print('::group::'+step['name'],flush=True)
              subprocess.run(['bash','-e','-c',step['run']],check=True)
              print('::endgroup::',flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 2611-L6000-all-coupler-final
          path: |
            2611_design1_L6000_straight_output.py
            DESIGN1_STRAIGHT_OUTPUT_README.txt
            validate_2611_coupler_release.py
            validate_2611_straight_output_raw.py
            validate_2611_two_coupler_windows.py
            gds/2611_design1_L6000_P10_straight_output_comparison.*
            gds/2611_coupler_release_validation.json
            gds/2611_straight_output_raw_validation.json
            gds/2611_two_coupler_windows_validation.json
            gds/2611_layer_cleanup_validation.json
            validation_2611_coupler_release/
            validation_2611_straight_output/
      - name: Commit validated output only
        run: |
          git config user.name "chatgpt-runner"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 2611_design1_L6000_straight_output.py DESIGN1_STRAIGHT_OUTPUT_README.txt validate_2611_coupler_release.py validate_2611_straight_output_raw.py validate_2611_two_coupler_windows.py gds/2611_design1_L6000_P10_straight_output_comparison.gds gds/2611_design1_L6000_P10_straight_output_comparison.json gds/2611_coupler_release_validation.json gds/2611_straight_output_raw_validation.json gds/2611_two_coupler_windows_validation.json gds/2611_layer_cleanup_validation.json
          git rm _update_all_coupler_windows.py .github/workflows/verify_2611_all_coupler_windows.yml .github/workflows/build_2611_all_coupler_final.yml
          git commit -m "Save terminal-only masks for both coupler sets and 1 um L14 expansion"
          git push
