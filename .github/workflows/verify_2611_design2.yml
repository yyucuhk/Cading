name: Build and verify single-device Design 2
on:
  push:
    branches: [design/2611-design2-offset-ridge]
defaults:
  run:
    shell: bash
jobs:
  verify:
    if: github.event.head_commit.message == 'Build and verify Design 2'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned geometry engine
        run: python -m pip install gdsfactory==9.45.0 matplotlib
      - name: Capture original design and 100 um slab reference
        run: python validate_2611_design2.py baseline
      - name: Create separate all-layer Design 2 source
        run: |
          python _create_design2_once.py
          python -m py_compile 2611_tapered_yue_design2.py validate_2611_design2.py
      - name: Validate dimensions connectivity inherited masks and export
        run: python validate_2611_design2.py
      - name: Prove existing source and GDS were not changed
        run: git diff --exit-code -- 2611_tapered_yue_dual_resist.py gds/2611_tapered_yue_dual_resist_L10_L12.gds
      - name: Upload candidate and measured polygon previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 2611-design2-review
          path: |
            2611_tapered_yue_design2.py
            validate_2611_design2.py
            gds/2611_tapered_yue_design2.gds
            gds/2611_design2_validation.json
            validation_2611_design2/
      - name: Commit only passing Design 2 output to review branch
        run: |
          git config user.name 'chatgpt-runner'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 2611_tapered_yue_design2.py gds/2611_tapered_yue_design2.gds gds/2611_design2_validation.json
          git commit -m 'Add verified Design 2 with 800 um meander and offset ridge taper'
          git push
