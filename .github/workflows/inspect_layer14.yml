name: Inspect Layer14 local geometry
# verify repaired geometry

on:
  push:

jobs:
  inspect:
    if: github.event.head_commit.message == 'Inspect Layer14 holes and contour'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install klayout
        run: python -m pip install klayout
      - name: Inspect holes and contour
        run: |
          python - <<'PY'
          import klayout.db as kdb

          path = "gds/2611_tapered_yue_dual_resist_L10_L12.gds"
          layout = kdb.Layout()
          layout.read(path)
          top = layout.top_cell()
          dbu = layout.dbu
          li = layout.layer(14, 0)
          region = kdb.Region(top.begin_shapes_rec(li))
          region.merge()

          print("HOLES near x=-462")
          for pi, poly in enumerate(region.each()):
              pb = poly.bbox()
              if pb.right*dbu < -480 or pb.left*dbu > -440:
                  continue
              try:
                  nh = poly.holes()
              except Exception:
                  nh = 0
              for hi in range(nh):
                  pts = list(poly.each_point_hole(hi))
                  xs=[p.x*dbu for p in pts]; ys=[p.y*dbu for p in pts]
                  if max(xs) >= -480 and min(xs) <= -440:
                      print("hole", pi, hi, "bbox", round(min(xs),3), round(min(ys),3), round(max(xs),3), round(max(ys),3))
                      print("pts", [(round(x,3),round(y,3)) for x,y in zip(xs,ys)])

          print("CONTOUR vertices x=-430..-418")
          for pi, poly in enumerate(region.each()):
              pb=poly.bbox()
              if pb.right*dbu < -430 or pb.left*dbu > -418:
                  continue
              pts=list(poly.each_point_hull())
              local=[(p.x*dbu,p.y*dbu) for p in pts if -431 <= p.x*dbu <= -417]
              if local:
                  print("poly",pi,"bbox",pb.left*dbu,pb.bottom*dbu,pb.right*dbu,pb.top*dbu)
                  print([(round(x,3),round(y,3)) for x,y in local])
          PY
