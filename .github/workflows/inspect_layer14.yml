name: Inspect Layer14 local geometry

on:
  push:

jobs:
  inspect:
    if: github.event.head_commit.message == 'Inspect Layer14 local geometry'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install klayout
        run: python -m pip install klayout
      - name: Inspect vertical cross-sections
        run: |
          python - <<'PY'
          import klayout.db as kdb

          path = "gds/2611_tapered_yue_dual_resist_L10_L12.gds"
          layout = kdb.Layout()
          layout.read(path)
          top = layout.top_cell()
          dbu = layout.dbu
          li = layout.layer(14, 0)
          region = kdb.Region(top.begin_shapes_rec(li))
          region.merge()

          bbox = region.bbox()
          print("DBU", dbu)
          print("L14 bbox um", bbox.left*dbu, bbox.bottom*dbu, bbox.right*dbu, bbox.top*dbu)

          for x in (-466,-464,-463,-462.5,-462,-461.5,-461,-460,-426,-425,-424.5,-424,-423.5,-423,-422.5,-422,-421):
              half = 0.002
              clip = kdb.Region(kdb.Box(
                  int(round((x-half)/dbu)),
                  bbox.bottom-1000,
                  int(round((x+half)/dbu)),
                  bbox.top+1000,
              ))
              cross = region & clip
              boxes = []
              for p in cross.each():
                  b = p.bbox()
                  boxes.append((round(b.bottom*dbu,3), round(b.top*dbu,3)))
              print(f"x={x:.3f}: {boxes}")
          PY
