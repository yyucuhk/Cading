name: Compare three device local tips

on:
  push:

jobs:
  inspect:
    if: github.event.head_commit.message == 'Compare three device local tips'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install gdsfactory==9.45.0 numpy klayout
      - name: Compare source-device tip geometry
        run: |
          python - <<'PY'
          import importlib.util
          from functools import partial
          import numpy as np
          import gdsfactory as gf

          spec=importlib.util.spec_from_file_location("layout2611","2611_tapered_yue_dual_resist.py")
          m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          gf.gpdk.PDK.activate()

          for L in m.MEANDER_STRAIGHT_LENGTHS:
              connection_width=m.REVIEW_TETHER_CONNECTION_WIDTH
              common=dict(
                  chip_length=6000,
                  tapered_fiber_angle=m.TAPER_ANGLE,
                  edge_coupler_spec=partial(m.edge_coupler,length=300,taper_length=100),
                  include_edge_couplers=False,
                  flatten=False,
                  s_bend_width=m.S_BEND_WIDTH,
                  s_bend_taper_length=m.S_BEND_TAPER_LENGTH,
                  s_bend_half_length=m.S_BEND_HALF_LENGTH,
                  s_bend_compact_180_radius=m.S_BEND_COMPACT_180_RADIUS,
                  s_bend_compact_euler_p=m.S_BEND_EULER_P,
                  s_bend_compact_straight_length=L,
                  s_bend_vertical_half_span=m.S_BEND_VERTICAL_HALF_SPAN,
                  s_bend_layer=m.MEANDER_CONSTRUCTION_LAYER,
                  ridge_s_bend_layer=m.RIDGE_LAYER,
                  ridge_s_bend_width=m.RIDGE_EXTENSION_END_WIDTH,
              )
              device=m.tapered_fiber_inout(
                  **common,
                  s_bend_support_shield_spec=partial(
                      m.phononic_meander_shield,
                      width=connection_width,
                      pitch=m.REVIEW_SUPPORT_ANCHOR_PERIOD,
                      bend_pitch=m.REVIEW_SUPPORT_BEND_PERIOD,
                      slab_width=m.S_BEND_WIDTH,
                      layer=m.FULL_ETCH_LAYER,
                      pnc_layer=m.PNC_EBL_LAYER,
                      layer14_fill_layer=m.Layers.via,
                      end_extension=m.PNC_NARROW_END_EXTENSION,
                  ),
                  tapered_fiber_spec=m.make_tapered_coupler(
                      connection_width,m.RIDGE_TAPER_LENGTH,
                      add_support_tips=False,
                      add_phononic_taper_support=True,
                      slab_layer=m.NEGATIVE_RESIST_LAYER,
                  ),
                  extra_rectangle_size=m.SUPPORT_RECTANGLE_SIZE,
                  extra_rectangle_gap=m.EXTRA_RECTANGLE_GAP,
                  extra_rectangle_layer=m.POSITIVE_RESIST_LAYER,
                  extra_rectangle_fill_layer=m.Layers.ring,
                  extra_rectangle_margin=0.0,
                  extra_rectangle_surround_slot_width=m.SUPPORT_SURROUND_SLOT_WIDTH,
                  tether_spec=partial(
                      m.TETHER_FACTORIES[m.TETHER_VARIANT],
                      layer=m.NEGATIVE_RESIST_LAYER,
                      pad_scale=m.TETHER_PAD_SCALE,
                      connection_width=connection_width,
                      connection_taper_length=m.TETHER_CONNECTION_BLEND_LENGTH,
                  ),
              )
              ws=m.tapered_fiber_inout(
                  **common,
                  tapered_fiber_spec=m.make_tapered_coupler(
                      connection_width,m.RIDGE_TAPER_LENGTH,
                      add_support_tips=False,
                      alignment_tick_layer=m.MARKER_LAYER,
                      slab_layer=m.NEGATIVE_RESIST_LAYER,
                  ),
              )
              comp=m.add_shared_mla_window(device,ws)
              starts=[]
              for center,orientation in zip(ws.info["s_bend_connection_centers"],ws.info["s_bend_connection_orientations"],strict=True):
                  from math import radians,cos,sin
                  a=radians(orientation); outward=np.array([-cos(a),-sin(a)])
                  starts.append(np.asarray(center,dtype=float)+(m.SLAB_EXTENSION_LENGTH+m.LAYER14_CHANNEL_START_OFFSET)*outward)
              starts=np.asarray(starts)
              idx=int(np.argmax(starts[:,0]))
              print("L",L,"tip_start",starts[idx].tolist(),"orient",ws.info["s_bend_connection_orientations"][idx],"left_pnc",float(device.bbox(layer=gf.get_layer(m.PNC_EBL_LAYER)).left))
              # Print L2 bbox around the chosen local tip using component polygons.
              tmp=comp.copy(); tmp.flatten()
              polys=tmp.get_polygons(by="tuple")
              arr=polys.get(tuple(m.POSITIVE_RESIST_LAYER),[])
              near=[]
              sx,sy=starts[idx]
              for p in arr:
                  b=p.bbox()
                  if b.right >= sx-10 and b.left <= sx+10 and b.top >= sy-20 and b.bottom <= sy+20:
                      near.append((round(float(b.left-sx),3),round(float(b.bottom-sy),3),round(float(b.right-sx),3),round(float(b.top-sy),3)))
              print("local_bboxes",sorted(near)[:30])
          PY
