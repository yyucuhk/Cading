name: Build Design 1 straight-output variants
on:
  push:
    branches: [layout/2611-L6000-straight-output]
    paths:
      - 2611_design1_L6000_straight_output.py
      - .github/workflows/verify_2611_straight_output.yml
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Preserve all previously approved repository files
        run: |
          mkdir -p validation_2611_straight_output
          python - <<'PY'
          import pathlib, hashlib, subprocess, json
          names=subprocess.check_output(['git','ls-tree','-r','--name-only','4dd360c60c826fd2f3e6604378bd2e40592a715f'],text=True).splitlines()
          hashes={p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in names}
          pathlib.Path('validation_2611_straight_output/protected_hashes.json').write_text(json.dumps(hashes,indent=2))
          PY
      - name: Use approved saved device polygons without reconstructing unchanged regions
        run: |
          python _prepare_2611_straight_output.py
          python _activate_2611_straight_output.py
      - name: Install the approved long-layout engine
        run: python -m pip install gdsfactory==9.45.0 klayout==0.30.13 numpy==2.4.6 kfactory==2.6.1
      - name: Build six complete devices and check geometry
        run: python 2611_design1_L6000_straight_output.py
      - name: Verify every existing file and output remained untouched
        run: |
          python - <<'PY'
          import pathlib, hashlib, json
          p=pathlib.Path('validation_2611_straight_output/protected_hashes.json')
          h=json.loads(p.read_text())
          bad=[n for n,s in h.items() if not pathlib.Path(n).exists() or hashlib.sha256(pathlib.Path(n).read_bytes()).hexdigest()!=s]
          assert not bad, bad
          q=pathlib.Path('gds/2611_design1_L6000_P10_straight_output_comparison.json')
          r=json.loads(q.read_text());r['protected_original_file_count']=len(h);r['original_files_unchanged']=True
          r['base_commit']='4dd360c60c826fd2f3e6604378bd2e40592a715f'
          q.write_text(json.dumps(r,indent=2))
          print('ALL',len(h),'existing files unchanged')
          PY
      - name: Upload editable source GDS reports and actual geometry previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 2611-L6000-straight-output-release
          path: |
            2611_design1_L6000_straight_output.py
            DESIGN1_STRAIGHT_OUTPUT_README.txt
            2611_design1_L6000_P10_width_sweep.py
            2611_tapered_yue_dual_resist.py
            layers.py
            markers.py
            phononics.py
            tapered_local.py
            tether_variants.py
            tether_variants.gds
            extract_layer2_gdsfactory.py
            text.py
            routing.py
            gds/2611_design1_L6000_P10_straight_output_comparison.*
            gds/2611_design1_L6000_P10_width_sweep.gds
            gds/2611_design1_L6000_P10_width_sweep.json
            validation_2611_straight_output/
          if-no-files-found: error
      - name: Commit only the validated additional output and remove runner
        run: |
          git config user.name 'chatgpt-runner'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 2611_design1_L6000_straight_output.py gds/2611_design1_L6000_P10_straight_output_comparison.gds gds/2611_design1_L6000_P10_straight_output_comparison.json gds/2611_design1_L6000_P10_straight_output_comparison.csv
          git rm .github/workflows/verify_2611_straight_output.yml _prepare_2611_straight_output.py _activate_2611_straight_output.py
          git commit -m 'Save checked original and straight-output Design 1 sets'
          git pull --rebase origin layout/2611-L6000-straight-output
          git push origin HEAD:layout/2611-L6000-straight-output
