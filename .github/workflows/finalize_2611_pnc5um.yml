name: Finalize saved 5 um PNC layouts
on:
  push:
    branches: [layout/2611-pnc5um-save-validated]
    paths: [.github/workflows/finalize_2611_pnc5um.yml]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Preserve original production geometry
        run: |
          mkdir -p validation_2611_pnc5um/baseline
          cp gds/2611_tapered_yue_dual_resist_L10_L12.gds gds/2611_tapered_yue_design2.gds gds/2611_design1_design2_L1400_18device_sweep.gds gds/2611_design1_L6000_P10_width_sweep.gds validation_2611_pnc5um/baseline/
      - uses: actions/download-artifact@v4
        with:
          name: 2611-pnc5um-saved-release
          run-id: 42341227214
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: validation_2611_pnc5um/candidate
      - name: Restore generated source and GDS without modifying geometry
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil,hashlib,json
          src=Path('validation_2611_pnc5um/candidate')
          for p in src.iterdir():
              if p.is_file() and p.suffix in ('.py','.md','.txt'):shutil.copy2(p,p.name)
          for p in (src/'gds').iterdir():shutil.copy2(p,Path('gds')/p.name)
          for dirname in ('validation_2611_combined_sweep','validation_2611_L6000_width_sweep'):
              if (src/dirname).exists():shutil.copytree(src/dirname,dirname,dirs_exist_ok=True)
          paths=list((src/'gds').glob('*.gds'))
          assert len(paths)==4
          Path('validation_2611_pnc5um/production_hashes_before.json').write_text(json.dumps({p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in paths},indent=2))
          PY
          python validate_2611_pnc5um_label_shift.py --patch-validator
      - name: Install approved short-layout engine for exact label isolation
        run: python -m pip install gdsfactory==9.45.0 kfactory==2.6.1 klayout==0.30.12 numpy==2.4.6
      - name: Independently compare unlabelled physical masks in fresh processes
        run: python validate_2611_pnc5um_label_shift.py --baseline-commit 6d4fcb56e649e80e0270c3af37be16a102799c00
      - name: Recheck saved GDS endpoints masks pitches labels and placement
        run: |
          python validate_2611_combined_sweep.py
          python validate_2611_vertical_sweep.py
          python validate_2611_straight_pitch.py
          python validate_2611_pnc5um.py
      - name: Render saved geometry and record verified output hashes
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          import klayout.db as kdb
          import matplotlib
          matplotlib.use('Agg')
          import matplotlib.pyplot as plt
          work=Path('validation_2611_pnc5um')
          expected=json.loads((work/'production_hashes_before.json').read_text())
          for name,h in expected.items():assert hashlib.sha256((Path('gds')/name).read_bytes()).hexdigest()==h,name
          for name,h in json.loads((work/'candidate/validation_2611_pnc5um/protected_hashes.json').read_text()).items():assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==h,name
          for d,filename in [(1,'2611_tapered_yue_dual_resist_L10_L12.gds'),(2,'2611_tapered_yue_design2.gds')]:
              ly=kdb.Layout();ly.read('gds/'+filename);top=ly.top_cell();dbu=ly.dbu
              cells=[i.cell for i in top.each_inst() if not kdb.Region(i.cell.begin_shapes_rec(ly.layer(51,0))).is_empty() and not kdb.Region(i.cell.begin_shapes_rec(ly.layer(15,0))).is_empty()]
              assert len(cells)==1
              c=cells[0];bounds=(680,-220,800,-180)
              roi=kdb.Region(kdb.Box(*(round(v/dbu) for v in bounds)))
              fig,ax=plt.subplots(figsize=(12,5))
              for n in (14,11,10,15,16):
                  reg=(kdb.Region(c.begin_shapes_rec(ly.layer(n,0)))&roi).merged();xs=[];ys=[]
                  for p in reg.each():
                      pts=[(v.x*dbu,v.y*dbu) for v in p.each_point_hull()]
                      if pts:
                          pts=pts+[pts[0]]+[(float('nan'),float('nan'))]
                          xs.extend(a for a,b in pts);ys.extend(b for a,b in pts)
                  ax.plot(xs,ys,linewidth=.8,label='Layer '+str(n))
              ax.axvline(731.378626347,linestyle='--',linewidth=.7)
              ax.text(732,-184,'PNC ends at 5 um width',fontsize=9)
              ax.set(xlim=(bounds[0],bounds[2]),ylim=(bounds[1],bounds[3]),xlabel='Device-local X (um)',ylabel='Device-local Y (um)',title=f'Design {d}: regenerated 5 um-cutoff junction')
              ax.set_aspect('equal');ax.legend(loc='upper right',fontsize=8);fig.tight_layout();fig.savefig(work/f'design{d}_pnc5um.png',dpi=180);plt.close(fig)
          report=json.loads((work/'validation_report.json').read_text());assert report['status']=='PASS'
          report['base_commit']='6d4fcb56e649e80e0270c3af37be16a102799c00'
          report['support_libraries_unchanged']=True
          report['generation_run_id']=42341227214
          report['verification_run_id']=int(os.environ['GITHUB_RUN_ID'])
          report['standalone_label_physical_mask_audit']=json.loads((work/'label_shift_validation.json').read_text())
          report['build_engine_versions']={'gdsfactory':'9.45.0','kfactory':'2.6.1','numpy':'2.4.6','short_klayout':'0.30.12','long_klayout':'0.30.13'}
          (work/'validation_report.json').write_text(json.dumps(report,indent=2))
          Path('gds/2611_pnc5um_validation.json').write_text(json.dumps(report,indent=2))
          Path('gds/2611_taper_pitch_validation.json').write_text(json.dumps({'status':'SUPERSEDED','current_report':'2611_pnc5um_validation.json','reason':'PNC endpoint changed from 3 um to 5 um; old taper tests target retired geometry.'},indent=2))
          (work/'build_status.json').write_text(json.dumps({'status':'PASS','outputs':report['outputs']},indent=2))
          PY
      - name: Upload saved code and all four checked GDS files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 2611-pnc5um-final-release
          path: |
            2611_tapered_yue_dual_resist.py
            2611_tapered_yue_design2.py
            2611_build_combined_sweep.py
            2611_design1_L6000_P10_width_sweep.py
            validate_2611_pnc5um.py
            validate_2611_pnc5um_label_shift.py
            validate_2611_combined_sweep.py
            validate_2611_vertical_sweep.py
            validate_2611_straight_pitch.py
            PNC5UM_README.txt
            CAD_EDITING_GUIDE.md
            COMBINED_SWEEP_README.md
            DESIGN1_L6000_WIDTH_SWEEP_README.md
            gds/2611_tapered_yue_dual_resist_L10_L12.gds
            gds/2611_tapered_yue_design2.gds
            gds/2611_design1_design2_L1400_18device_sweep.*
            gds/2611_design1_L6000_P10_width_sweep.*
            gds/2611_pnc5um_validation.json
            gds/2611_combined_sweep_validation.json
            gds/2611_vertical_sweep_validation.json
            gds/2611_straight_pitch_validation.json
            validation_2611_pnc5um/*.json
            validation_2611_pnc5um/*.png
            validation_2611_pnc5um/label_audit_*.gds
            validation_2611_combined_sweep/combined_sweep.png
            validation_2611_L6000_width_sweep/overview.png
      - name: Commit passing source and outputs and remove temporary runners
        run: |
          git config user.name "chatgpt-runner"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm _apply_pnc5um_once.py .github/workflows/verify_2611_pnc5um.yml .github/workflows/finalize_2611_pnc5um.yml
          git add -u
          git add PNC5UM_README.txt gds/2611_pnc5um_validation.json
          git commit -m "Save verified 5 um PNC cutoff source and all four regenerated GDS files"
          git push
