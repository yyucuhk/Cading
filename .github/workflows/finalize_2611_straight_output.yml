name: Finalize complete straight-output replacement
on:
  push:
    branches: [layout/2611-L6000-straight-output]
    paths: [.github/workflows/finalize_2611_straight_output.yml]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Preserve original files and include complete output pads in replacement window
        run: |
          mkdir -p validation_2611_straight_output
          python - <<'PY'
          import pathlib, hashlib, subprocess, json
          names=subprocess.check_output(['git','ls-tree','-r','--name-only','4dd360c60c826fd2f3e6604378bd2e40592a715f'],text=True).splitlines()
          hashes={p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in names}
          pathlib.Path('validation_2611_straight_output/protected_hashes.json').write_text(json.dumps(hashes,indent=2))
          p=pathlib.Path('2611_design1_L6000_straight_output.py');s=p.read_text()
          assert s.count('px + length) + 10, py / 2')==1
          s=s.replace('px + length) + 10, py / 2','px + length) + 10, py / 8')
          s=s.replace('    # meander or input assembly is replaced. This is NOT a whole-device splice.','    # meander or input assembly is replaced. At y=-25 this also includes the\n    # complete output glue pads (whose top is y=-50), not clipped pad caps.')
          p.write_text(s);compile(s,str(p),'exec')
          PY
      - name: Install approved geometry engine
        run: python -m pip install gdsfactory==9.45.0 klayout==0.30.13 numpy==2.4.6 kfactory==2.6.1
      - name: Generate all six devices with complete output replacement
        run: python 2611_design1_L6000_straight_output.py
      - name: Independently parse actual GDS records and compare all original regions
        run: python validate_2611_straight_output_raw.py
      - name: Verify original-file hashes and save both validation records
        run: |
          python - <<'PY'
          import pathlib, hashlib, json
          root=pathlib.Path('.')
          h=json.loads((root/'validation_2611_straight_output/protected_hashes.json').read_text())
          bad=[n for n,s in h.items() if not pathlib.Path(n).exists() or hashlib.sha256(pathlib.Path(n).read_bytes()).hexdigest()!=s]
          assert not bad,bad
          p=root/'gds/2611_design1_L6000_P10_straight_output_comparison.json'
          r=json.loads(p.read_text());r['protected_original_file_count']=len(h);r['original_files_unchanged']=True
          r['base_commit']='4dd360c60c826fd2f3e6604378bd2e40592a715f'
          raw=json.loads((root/'validation_2611_straight_output/raw_gds_audit.json').read_text())
          assert raw['status']=='PASS'
          r['independent_raw_gds_check_count']=raw['check_count']
          (root/'gds/2611_straight_output_raw_validation.json').write_text(json.dumps(raw,indent=2))
          p.write_text(json.dumps(r,indent=2))
          print('ALL',len(h),'existing files unchanged; builder',r['check_count'],'raw',raw['check_count'])
          PY
      - name: Upload final code GDS independent audits and exported previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 2611-L6000-straight-output-final
          path: |
            2611_design1_L6000_straight_output.py
            validate_2611_straight_output_raw.py
            DESIGN1_STRAIGHT_OUTPUT_README.txt
            2611_design1_L6000_P10_width_sweep.py
            2611_tapered_yue_dual_resist.py
            layers.py
            markers.py
            phononics.py
            tapered_local.py
            tether_variants.py
            tether_variants.gds
            extract_layer2_gdsfactory.py
            text.py
            routing.py
            gds/2611_design1_L6000_P10_straight_output_comparison.*
            gds/2611_straight_output_raw_validation.json
            gds/2611_design1_L6000_P10_width_sweep.gds
            gds/2611_design1_L6000_P10_width_sweep.json
            validation_2611_straight_output/
          if-no-files-found: error
      - name: Save only passing new files and remove temporary runner
        run: |
          git config user.name 'chatgpt-runner'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 2611_design1_L6000_straight_output.py gds/2611_design1_L6000_P10_straight_output_comparison.gds gds/2611_design1_L6000_P10_straight_output_comparison.json gds/2611_design1_L6000_P10_straight_output_comparison.csv gds/2611_straight_output_raw_validation.json
          git rm .github/workflows/finalize_2611_straight_output.yml
          git commit -m 'Save complete straight-output layout and independent exported geometry audit'
          git pull --rebase origin layout/2611-L6000-straight-output
          git push origin HEAD:layout/2611-L6000-straight-output
