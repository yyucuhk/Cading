name: Verify 2611 alignment tips on Layer 15
on:
  push:
    branches: [layout/2611-alignment-tips-layer15]
defaults:
  run:
    shell: bash
jobs:
  verify:
    if: github.event.head_commit.message == 'Validate alignment tips moved to Layer 15'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned layout engine
        run: python -m pip install gdsfactory==9.45.0 matplotlib
      - name: Preserve approved aligned GDS
        run: |
          mkdir -p validation_2611_tips
          cp gds/2611_tapered_yue_dual_resist_L10_L12.gds validation_2611_tips/before.gds
      - name: Apply isolated alignment-tip layer reassignment
        run: |
          python _move_2611_tips_once.py
          python -m py_compile 2611_tapered_yue_dual_resist.py validate_2611_sweep.py validate_2611_tip_layers.py
      - name: Check all-layer factory and regenerate output
        run: python validate_2611_sweep.py | tee validation_2611_tips/sweep.log
      - name: Check unchanged symmetric release windows
        run: python validate_2611_windows.py | tee validation_2611_tips/windows.log
      - name: Check exact tip transfer and every unchanged polygon
        run: python validate_2611_tip_layers.py validation_2611_tips/before.gds gds/2611_tapered_yue_dual_resist_L10_L12.gds | tee validation_2611_tips/tips.log
      - name: Upload source GDS and inspection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 2611-tip-layer15-review
          path: |
            2611_tapered_yue_dual_resist.py
            validate_2611_tip_layers.py
            validate_2611_sweep.py
            gds/2611_tapered_yue_dual_resist_L10_L12.gds
            validation_2611_tips/
            validation_2611/validation_report.json
            validation_2611_windows/validation_report.json
      - name: Commit only verified source and GDS on the review branch
        run: |
          cp validation_2611_tips/validation_report.json gds/2611_tip_layer_validation.json
          cp validation_2611/validation_report.json gds/2611_sweep_validation.json
          cp validation_2611_windows/validation_report.json gds/2611_window_validation.json
          git config user.name 'chatgpt-runner'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 2611_tapered_yue_dual_resist.py validate_2611_sweep.py gds/2611_tapered_yue_dual_resist_L10_L12.gds gds/2611_tip_layer_validation.json gds/2611_sweep_validation.json gds/2611_window_validation.json
          git commit -m 'Move only taper alignment tips from Layer 10 to Layer 15'
          git push
