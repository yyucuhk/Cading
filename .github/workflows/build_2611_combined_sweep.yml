name: Build verified combined 18-device sweep
on:
  push:
    branches: [layout/2611-combined-18-device-sweep]
jobs:
  build:
    if: github.event.head_commit.message == 'Build verified combined 18-device sweep'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned layout engine
        run: python -m pip install gdsfactory==9.45.0 matplotlib
      - name: Set both standalone designs to 1400 um without changing geometry functions
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          for filename, old in [('2611_tapered_yue_dual_resist.py', 'MEANDER_STRAIGHT_LENGTHS = (800,)'), ('2611_tapered_yue_design2.py', 'MEANDER_STRAIGHT_LENGTHS = (800.0,)')]:
              p=Path(filename); original=p.read_text(); new=original
              if old in new:
                  assert new.count(old)==1
                  new=new.replace(old, 'MEANDER_STRAIGHT_LENGTHS = (1400.0,)')
              else:
                  assert 'MEANDER_STRAIGHT_LENGTHS = (1400.0,)' in new
              if filename.endswith('design2.py'):
                  new=new.replace('TOP_CELL_NAME = "Design2_L800"', 'TOP_CELL_NAME = "Design2_L1400"')
              def functions(s):
                  return [ast.dump(n, include_attributes=False) for n in ast.parse(s).body if isinstance(n, (ast.FunctionDef, ast.ClassDef))]
              assert functions(original)==functions(new)
              p.write_text(new)
          PY
          python -m py_compile 2611_build_combined_sweep.py 2611_tapered_yue_dual_resist.py 2611_tapered_yue_design2.py
      - name: Regenerate individual default designs
        run: |
          python 2611_tapered_yue_dual_resist.py
          python 2611_tapered_yue_design2.py
      - name: Build all 18 isolated cases and verify exported combined GDS
        run: python 2611_build_combined_sweep.py
      - name: Upload source GDS per-case measurements and previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 2611-combined-18device-review
          path: |
            2611_build_combined_sweep.py
            2611_tapered_yue_dual_resist.py
            2611_tapered_yue_design2.py
            gds/2611_design1_design2_L1400_18device_sweep.*
            gds/2611_tapered_yue_dual_resist_L10_L12.gds
            gds/2611_tapered_yue_design2.gds
            validation_2611_combined_sweep/
      - name: Commit only passing combined output and 1400 um defaults
        run: |
          git config user.name "chatgpt-runner"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 2611_tapered_yue_dual_resist.py 2611_tapered_yue_design2.py
          git add gds/2611_design1_design2_L1400_18device_sweep.gds gds/2611_design1_design2_L1400_18device_sweep.json gds/2611_design1_design2_L1400_18device_sweep.csv
          git add gds/2611_tapered_yue_dual_resist_L10_L12.gds gds/2611_tapered_yue_design2.gds
          git diff --cached --quiet || git commit -m "Generate validated combined 18-device parameter sweep"
          git push
