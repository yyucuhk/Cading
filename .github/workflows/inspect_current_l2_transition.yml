name: Inspect current Layer2 transition

on:
  push:

jobs:
  inspect:
    if: github.event.head_commit.message == 'Inspect current Layer2 transition'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install klayout
        run: python -m pip install klayout
      - name: Inspect Layer2 around -422
        run: |
          python - <<'PY'
          import klayout.db as kdb
          path="gds/2611_tapered_yue_dual_resist_L10_L12.gds"
          ly=kdb.Layout(); ly.read(path); top=ly.top_cell(); dbu=ly.dbu
          reg=kdb.Region(top.begin_shapes_rec(ly.layer(2,0))); reg.merge()
          bbox=reg.bbox()
          for x in (-430,-428,-426,-425,-424.5,-424,-423.5,-423,-422.5,-422,-421.5,-421,-420.5,-420,-419,-418,-417,-416,-415):
              half=0.002
              clip=kdb.Region(kdb.Box(int((x-half)/dbu), bbox.bottom-1000, int((x+half)/dbu), bbox.top+1000))
              cr=reg & clip
              spans=[]
              for p in cr.each():
                  b=p.bbox()
                  if -950 <= b.bottom*dbu <= -850 or -950 <= b.top*dbu <= -850:
                      spans.append((round(b.bottom*dbu,3),round(b.top*dbu,3)))
              print(f"x={x:.3f}: {spans}")
          PY
