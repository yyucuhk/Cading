name: Verify revised Design 2 taper stages
on:
  push:
    branches: [design/2611-design2-three-stage-tapers]
defaults:
  run:
    shell: bash
jobs:
  verify:
    if: github.event.head_commit.message == 'Build and verify revised Design 2 taper stages'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install layout engine
        run: python -m pip install gdsfactory==9.45.0 matplotlib
      - name: Save original Design 2 and protect Design 1
        run: |
          mkdir -p validation_2611_design2
          cp gds/2611_tapered_yue_design2.gds validation_2611_design2/before.gds
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          names = ['2611_tapered_yue_dual_resist.py', 'gds/2611_tapered_yue_dual_resist_L10_L12.gds']
          data = {n: hashlib.sha256(Path(n).read_bytes()).hexdigest() for n in names}
          Path('validation_2611_design2/protected_hashes.json').write_text(json.dumps(data))
          PY
      - name: Apply guarded taper update
        run: |
          python _update_design2_stages_once.py
          python - <<'PY'
          from pathlib import Path
          p = Path('validate_2611_design2_stages.py')
          s = p.read_text()
          old = '''    for layer in sorted(expected_layers):
                  reg=r[layer]-label if layer==(2,0) else r[layer]
                  diff=((reg^reg.transformed(kdb.Trans(kdb.Trans.R180)))&roi).area()*dbu**2
                  check(f'layer{layer[0]}_end_to_end_symmetry',diff<=TOL,rotated_xor_um2=float(diff))'''
          # Remove YAML indentation from this embedded source pattern.
          import textwrap
          old = '\n'.join([old.splitlines()[0]] + [line[6:] for line in old.splitlines()[1:]])
          new = '''    # A label can overlap valid release geometry. Compare complete masks
              # first, then exclude only the actual text polygons and their rotated
              # counterparts, rather than cutting a bounding-box hole into a mask.
              left_tip = min(d.info['tip_centers'], key=lambda p: p[0])
              label_component = gf.components.text(
                  text=f"DESIGN 2_L800_ML{float(d.info['total_meander_length_um']):.1f}",
                  size=m.DETAIL_LABEL_SIZE, layer=m.MARKER_LAYER)
              exact_text = snapshot(label_component)[(2,0)].transformed(kdb.Trans(
                  round((left_tip[0]+m.DETAIL_LABEL_TIP_X_OFFSET)/dbu),
                  round((left_tip[1]+m.DETAIL_LABEL_TIP_Y_OFFSET)/dbu)))
              text_exclusion = exact_text + exact_text.transformed(kdb.Trans(kdb.Trans.R180))
              for layer in sorted(expected_layers):
                  reg = r[layer]
                  delta = (reg ^ reg.transformed(kdb.Trans(kdb.Trans.R180))) & roi
                  if layer == (2,0):
                      delta -= text_exclusion
                  diff = delta.area()*dbu**2
                  check(f'layer{layer[0]}_end_to_end_symmetry',diff<=TOL,rotated_xor_um2=float(diff))'''
          new = '\n'.join([new.splitlines()[0]] + [line[10:] for line in new.splitlines()[1:]])
          assert s.count(old) == 1, repr(old)
          p.write_text(s.replace(old,new,1))
          PY
          python -m py_compile 2611_tapered_yue_design2.py validate_2611_design2.py validate_2611_design2_stages.py
      - name: Validate measured stages all masks and exported GDS
        run: python validate_2611_design2.py | tee validation_2611_design2/run.log
      - name: Upload source GDS measured dimensions and previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: design2-revised-stages
          path: |
            2611_tapered_yue_design2.py
            DESIGN2_README.md
            validate_2611_design2.py
            validate_2611_design2_stages.py
            gds/2611_tapered_yue_design2.gds
            validation_2611_design2/
      - name: Commit only verified source and generated output
        run: |
          cp validation_2611_design2/validation_report.json gds/2611_design2_validation.json
          git diff --exit-code -- 2611_tapered_yue_dual_resist.py gds/2611_tapered_yue_dual_resist_L10_L12.gds
          git config user.name chatgpt-runner
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add 2611_tapered_yue_design2.py DESIGN2_README.md validate_2611_design2.py validate_2611_design2_stages.py gds/2611_tapered_yue_design2.gds gds/2611_design2_validation.json
          git commit -m 'Update Design 2 to three slab stages and two ridge stages'
          git push
