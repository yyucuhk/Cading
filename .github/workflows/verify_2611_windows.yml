name: Verify symmetric 2611 release windows
on:
  push:
    branches: [fix/2611-symmetric-release-windows]
defaults:
  run:
    shell: bash
jobs:
  verify:
    if: github.event.head_commit.message == 'Validate symmetric 2611 release windows'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned layout engine
        run: python -m pip install gdsfactory==9.45.0 matplotlib
      - name: Snapshot all three unchanged baseline devices
        run: python validate_2611_windows.py baseline
      - name: Apply local two-ended window update
        run: |
          python _update_2611_windows_once.py
          python -m py_compile 2611_tapered_yue_dual_resist.py validate_2611_windows.py
          git diff --stat
      - name: Validate complete sweep and regenerate GDS
        run: python validate_2611_sweep.py
      - name: Validate symmetry, holes, and unchanged layers
        run: python validate_2611_windows.py
      - name: Upload GDS, source, tests, and geometry review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 2611-symmetric-window-review
          path: |
            2611_tapered_yue_dual_resist.py
            validate_2611_windows.py
            validate_2611_sweep.py
            gds/2611_tapered_yue_dual_resist_L10_L12.gds
            validation_2611/
            validation_2611_windows/
      - name: Commit only validated mask update to repair branch
        run: |
          cp validation_2611/validation_report.json gds/2611_sweep_validation.json
          cp validation_2611_windows/validation_report.json gds/2611_window_validation.json
          git config user.name 'chatgpt-runner'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 2611_tapered_yue_dual_resist.py gds/2611_tapered_yue_dual_resist_L10_L12.gds gds/2611_sweep_validation.json gds/2611_window_validation.json
          git commit -m 'Fill Layer 14 taper holes and remove tip-window blocks symmetrically'
          git push
