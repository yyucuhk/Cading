name: Verify 5 um cutoff and full mask continuity
on:
  push:
    branches: [layout/2611-pnc-cutoff-5um]
    paths: [.github/workflows/verify_2611_pnc5_r2.yml]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install approved short-layout engine
        run: python -m pip install gdsfactory==9.45.0 klayout==0.30.12
      - name: Capture four approved baseline GDSs
        run: python validate_2611_pnc5_cutoff.py capture
      - name: Update both PNC cutoffs and dependent masks and tests
        run: |
          python _pnc5_migrate_once.py
          python _pnc5_finish_once.py prepare
      - name: Regenerate two standalone designs and all 18 combined devices
        run: |
          python 2611_tapered_yue_dual_resist.py
          python 2611_tapered_yue_design2.py
          python 2611_build_combined_sweep.py
      - name: Verify complete ends connectivity single labels placement and straight PNCs
        run: |
          python validate_2611_combined_sweep.py
          python validate_2611_vertical_sweep.py
          python validate_2611_straight_pitch.py
      - name: Regenerate 6000 um width sweep using its approved engine
        run: |
          python -m pip install klayout==0.30.13
          python 2611_design1_L6000_P10_width_sweep.py
      - name: Measure 5 um junctions and prove meander and downstream shape preservation
        run: python validate_2611_pnc5_cutoff.py
      - name: Update documentation and reproduction metadata
        run: python _pnc5_finish_once.py docs
      - name: Upload actual outputs code and checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 2611-pnc5-endpoint-release
          path: |
            2611_tapered_yue_dual_resist.py
            2611_tapered_yue_design2.py
            2611_build_combined_sweep.py
            2611_design1_L6000_P10_width_sweep.py
            validate_2611_pnc5_cutoff.py
            validate_2611_taper_pitch.py
            validate_2611_combined_sweep.py
            validate_2611_vertical_sweep.py
            validate_2611_straight_pitch.py
            PNC_5UM_ENDPOINT_README.md
            CAD_EDITING_GUIDE.md
            COMBINED_SWEEP_README.md
            DESIGN1_L6000_WIDTH_SWEEP_README.md
            gds/2611_tapered_yue_dual_resist_L10_L12.gds
            gds/2611_tapered_yue_design2.gds
            gds/2611_design1_design2_L1400_18device_sweep.*
            gds/2611_design1_L6000_P10_width_sweep.*
            gds/2611_combined_sweep_validation.json
            gds/2611_straight_pitch_validation.json
            gds/2611_vertical_sweep_validation.json
            gds/2611_pnc5_cutoff_validation.json
            gds/2611_taper_pitch_validation.json
            validation_2611_pnc5_cutoff/*.png
            validation_2611_pnc5_cutoff/validation_report.json
            validation_2611_combined_sweep/*.log
          if-no-files-found: error
      - name: Commit validated code and all four GDSs and remove temporary runners
        run: |
          git config user.name 'chatgpt-runner'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 2611_tapered_yue_dual_resist.py 2611_tapered_yue_design2.py 2611_build_combined_sweep.py 2611_design1_L6000_P10_width_sweep.py validate_2611_combined_sweep.py validate_2611_pnc5_cutoff.py validate_2611_taper_pitch.py validate_2611_straight_pitch.py PNC_5UM_ENDPOINT_README.md CAD_EDITING_GUIDE.md COMBINED_SWEEP_README.md DESIGN1_L6000_WIDTH_SWEEP_README.md
          git add gds/2611*.gds gds/2611*.json gds/2611*.csv
          git rm _pnc5_migrate_once.py _pnc5_finish_once.py .github/workflows/verify_2611_pnc5.yml .github/workflows/verify_2611_pnc5_r2.yml
          git commit -m 'Terminate PNC at 5 um width and update all taper and mask junctions'
          git pull --rebase origin layout/2611-pnc-cutoff-5um
          git push origin HEAD:layout/2611-pnc-cutoff-5um
