name: Verify both ends of all 18 exported devices
on:
  push:
    branches: [layout/2611-combined-18-device-sweep]
jobs:
  verify:
    if: github.event.head_commit.message == 'Verify both ends of all 18 exported devices'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned geometry engine
        run: python -m pip install gdsfactory==9.45.0 matplotlib
      - name: Independently measure all taper ends from the exported GDS
        run: python validate_2611_combined_sweep.py
      - name: Render actual combined GDS and preserve output hash
        run: |
          python - <<'PY'
          import importlib.util,json,hashlib
          from pathlib import Path
          p=Path('2611_build_combined_sweep.py')
          spec=importlib.util.spec_from_file_location('sweep',p)
          m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          before=hashlib.sha256(m.OUTPUT.read_bytes()).hexdigest()
          m.WORK.mkdir(exist_ok=True)
          ly,top=m.read_gds(m.OUTPUT)
          m.render(ly,top,json.loads(m.MANIFEST.read_text()))
          assert before==hashlib.sha256(m.OUTPUT.read_bytes()).hexdigest()
          PY
      - name: Upload final code GDS table report and preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 2611-combined-18device-release
          path: |
            2611_build_combined_sweep.py
            validate_2611_combined_sweep.py
            2611_tapered_yue_dual_resist.py
            2611_tapered_yue_design2.py
            COMBINED_SWEEP_README.md
            gds/2611_design1_design2_L1400_18device_sweep.*
            gds/2611_combined_sweep_validation.json
            gds/2611_tapered_yue_dual_resist_L10_L12.gds
            gds/2611_tapered_yue_design2.gds
            validation_2611_combined_sweep/combined_sweep.png
      - name: Commit passing independent validation report
        run: |
          git config user.name "chatgpt-runner"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gds/2611_combined_sweep_validation.json
          git diff --cached --quiet || git commit -m "Verify both ends of every combined sweep device"
          git push
