name: Finalize linear Layer 14 windows
on:
  push:
    branches: [layout/2611-L6000-linear-L14-window]
    paths: [.github/workflows/finalize_2611_linear_window.yml]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Execute the guarded rebuild and all independent checks
        run: |
          python -m pip install PyYAML
          python - <<'PY'
          import yaml,subprocess
          from pathlib import Path
          steps=yaml.safe_load(Path('.github/workflows/verify_2611_linear_window.yml').read_text())['jobs']['verify']['steps']
          for step in steps:
              if 'run' not in step or step['name'].startswith('Save only'):continue
              print('::group::'+step['name'],flush=True)
              subprocess.run(['bash','-e','-c',step['run']],check=True)
              print('::endgroup::',flush=True)
          PY
      - name: Upload final source GDS and measured previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 2611-L6000-linear-L14-final
          path: |
            2611_design1_L6000_straight_output.py
            2611_design1_L6000_P10_width_sweep.py
            2611_tapered_yue_dual_resist.py
            linear_layer14_window.py
            validate_2611_linear_window.py
            validate_2611_four_sets.py
            validate_2611_taper_beams.py
            validate_2611_straight_output_raw.py
            validate_2611_release_offset.py
            validate_2611_coupler_release.py
            DESIGN1_STRAIGHT_OUTPUT_README.txt
            layers.py
            markers.py
            phononics.py
            routing.py
            tapered_local.py
            tether_variants.py
            tether_variants.gds
            text.py
            gds/2611_design1_L6000_P10_straight_output_comparison.*
            gds/2611_design1_L6000_P10_width_sweep.*
            gds/2611_linear_window_validation.json
            gds/2611_four_sets_validation.json
            gds/2611_taper_beams_validation.json
            validation_2611_linear_window/*.png
            validation_2611_four_sets/*.png
            validation_2611_straight_output/*.log
            baseline/comparison.gds
      - name: Save passing files and remove temporary runners
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 2611_design1_L6000_straight_output.py DESIGN1_STRAIGHT_OUTPUT_README.txt validate_2611_four_sets.py linear_layer14_window.py validate_2611_linear_window.py
          git add gds/2611_design1_L6000_P10_straight_output_comparison.gds gds/2611_design1_L6000_P10_straight_output_comparison.json gds/2611_four_sets_validation.json gds/2611_taper_beams_validation.json gds/2611_linear_window_validation.json
          git rm _apply_2611_linear_window.py .github/workflows/verify_2611_linear_window.yml .github/workflows/finalize_2611_linear_window.yml
          git commit -m 'Save verified linear Layer 14 channels and retain all other device geometry'
          git push origin HEAD:layout/2611-L6000-linear-L14-window
