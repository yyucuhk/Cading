name: Inspect Layer2 tip block

on:
  push:

jobs:
  inspect:
    if: github.event.head_commit.message == 'Inspect Layer2 tip holes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install klayout
        run: python -m pip install klayout
      - name: Inspect
        run: |
          python - <<'PY'
          import klayout.db as kdb
          path="gds/2611_tapered_yue_dual_resist_L10_L12.gds"
          ly=kdb.Layout(); ly.read(path); top=ly.top_cell(); dbu=ly.dbu
          for layer_num in (2,14):
              li=ly.layer(layer_num,0)
              reg=kdb.Region(top.begin_shapes_rec(li)); reg.merge()
              print("LAYER",layer_num)
              for i,p in enumerate(reg.each()):
                  b=p.bbox()
                  if not (b.bottom*dbu <= -900 <= b.top*dbu):
                      continue
                  print("poly",i,"bbox",tuple(round(v,3) for v in (b.left*dbu,b.bottom*dbu,b.right*dbu,b.top*dbu)),"holes",p.holes())
                  for hi in range(p.holes()):
                      pts=list(p.each_point_hole(hi))
                      xs=[q.x*dbu for q in pts]; ys=[q.y*dbu for q in pts]
                      hb=(min(xs),min(ys),max(xs),max(ys))
                      if hb[2] >= -480 and hb[0] <= -390:
                          print("hole",hi,"bbox",tuple(round(v,3) for v in hb))
                          print("pts",[(round(x,3),round(y,3)) for x,y in zip(xs,ys)])
          PY
