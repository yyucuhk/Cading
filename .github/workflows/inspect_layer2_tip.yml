name: Inspect device-local L2-L14 difference

on:
  push:

jobs:
  inspect:
    if: github.event.head_commit.message == 'Inspect final device local L2 L14 diff'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install klayout
        run: python -m pip install klayout
      - name: Inspect
        run: |
          python - <<'PY'
          import klayout.db as kdb
          path="gds/2611_tapered_yue_dual_resist_L10_L12.gds"
          ly=kdb.Layout(); ly.read(path); top=ly.top_cell(); dbu=ly.dbu
          l2=kdb.Region(top.begin_shapes_rec(ly.layer(2,0))); l2.merge()
          l14=kdb.Region(top.begin_shapes_rec(ly.layer(14,0))); l14.merge()
          miss=l2-l14
          roi=kdb.Region(kdb.Box(int(-3000/dbu),int(-1100/dbu),int(2300/dbu),int(1100/dbu)))
          miss &= roi
          miss.merge()
          print("local missing area um2", miss.area()*dbu*dbu)
          for i,p in enumerate(miss.each()):
              b=p.bbox()
              area=p.area()*dbu*dbu
              print("poly",i,"area",round(area,6),"bbox",tuple(round(v,3) for v in (b.left*dbu,b.bottom*dbu,b.right*dbu,b.top*dbu)))
          PY
