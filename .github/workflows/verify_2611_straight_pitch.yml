name: Verify exact 5 um straight PNC pitch
on:
  push:
    branches: [layout/2611-straight-pnc-5um]
jobs:
  verify:
    if: github.event.head_commit.message == 'Build and verify exact 5 um straight PNC pitch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned layout engine
        run: python -m pip install gdsfactory==9.45.0
      - name: Preserve approved combined and standalone geometry
        run: |
          mkdir -p validation_2611_straight_pitch
          cp gds/2611_design1_design2_L1400_18device_sweep.gds validation_2611_straight_pitch/before.gds
          cp gds/2611_design1_design2_L1400_18device_sweep.json validation_2611_straight_pitch/before.json
          cp gds/2611_tapered_yue_dual_resist_L10_L12.gds validation_2611_straight_pitch/
          cp gds/2611_tapered_yue_design2.gds validation_2611_straight_pitch/
      - name: Apply isolated straight-PNC setting and fixed-pitch sampler
        run: |
          python _set_straight_pitch5_once.py
          python -m py_compile 2611_tapered_yue_dual_resist.py 2611_tapered_yue_design2.py 2611_build_combined_sweep.py validate_2611_straight_pitch.py
      - name: Regenerate both standalone designs
        run: |
          python 2611_tapered_yue_dual_resist.py
          python 2611_tapered_yue_design2.py
      - name: Regenerate all 18 devices and measure actual path populations
        run: python 2611_build_combined_sweep.py
      - name: Verify complete ends connectivity single labels and placement
        run: |
          python validate_2611_combined_sweep.py
          python validate_2611_vertical_sweep.py
      - name: Independently measure all straight PNCs in exported GDS and compare baseline
        run: python validate_2611_straight_pitch.py
      - name: Upload code GDS reports and measured preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 2611-straight-pnc-5um-release
          path: |
            2611_build_combined_sweep.py
            2611_tapered_yue_dual_resist.py
            2611_tapered_yue_design2.py
            validate_2611_straight_pitch.py
            validate_2611_combined_sweep.py
            validate_2611_vertical_sweep.py
            COMBINED_SWEEP_README.md
            CAD_EDITING_GUIDE.md
            gds/2611_design1_design2_L1400_18device_sweep.*
            gds/2611_tapered_yue_dual_resist_L10_L12.gds
            gds/2611_tapered_yue_design2.gds
            gds/2611_straight_pitch_validation.json
            gds/2611_combined_sweep_validation.json
            gds/2611_vertical_sweep_validation.json
            validation_2611_straight_pitch/straight_pnc_5um.png
            validation_2611_straight_pitch/validation_report.json
            validation_2611_combined_sweep/combined_sweep.png
            validation_2611_combined_sweep/*.log
      - name: Commit only passing geometry and remove temporary runner
        run: |
          git config user.name 'chatgpt-runner'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 2611_build_combined_sweep.py 2611_tapered_yue_dual_resist.py 2611_tapered_yue_design2.py CAD_EDITING_GUIDE.md COMBINED_SWEEP_README.md
          git add gds/2611_design1_design2_L1400_18device_sweep.* gds/2611_tapered_yue_dual_resist_L10_L12.gds gds/2611_tapered_yue_design2.gds
          git add gds/2611_straight_pitch_validation.json gds/2611_combined_sweep_validation.json gds/2611_vertical_sweep_validation.json
          git rm _set_straight_pitch5_once.py .github/workflows/verify_2611_straight_pitch.yml
          git commit -m 'Set exact 5 um PNC pitch on all straight meander sections'
          git push
