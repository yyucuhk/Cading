name: Verify placement-only 2611 left bend alignment
on:
  push:
    branches: [layout/2611-left-bend-alignment]
defaults:
  run:
    shell: bash
jobs:
  verify:
    if: github.event.head_commit.message == 'Validate placement-only left bend alignment'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned layout engine
        run: python -m pip install gdsfactory==9.45.0 matplotlib
      - name: Preserve the approved GDS and all three device baselines
        run: |
          mkdir -p validation_2611_alignment
          cp gds/2611_tapered_yue_dual_resist_L10_L12.gds validation_2611_alignment/before_alignment.gds
          cp 2611_tapered_yue_dual_resist.py validation_2611_alignment/before_alignment.py
          python validate_2611_windows.py baseline
      - name: Change only top-level placement and placement tests
        run: |
          python _align_2611_placement_once.py
          python -m py_compile 2611_tapered_yue_dual_resist.py validate_2611_sweep.py validate_2611_windows.py validate_2611_alignment.py
          git diff --stat
      - name: Run all-layer sweep regression and regenerate GDS
        run: python validate_2611_sweep.py | tee validation_2611_alignment/sweep.log
      - name: Confirm symmetric windows and preserved layers
        run: python validate_2611_windows.py | tee validation_2611_alignment/windows.log
      - name: Compare complete exported devices and actual aligned bends
        run: python validate_2611_alignment.py validation_2611_alignment/before_alignment.gds | tee validation_2611_alignment/alignment.log
      - name: Upload candidate GDS and validation review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 2611-left-bend-alignment-review
          path: |
            2611_tapered_yue_dual_resist.py
            validate_2611_sweep.py
            validate_2611_windows.py
            validate_2611_alignment.py
            gds/2611_tapered_yue_dual_resist_L10_L12.gds
            validation_2611/validation_report.json
            validation_2611_windows/validation_report.json
            validation_2611_alignment/
      - name: Commit only a validated alignment to the review branch
        run: |
          cp validation_2611/validation_report.json gds/2611_sweep_validation.json
          cp validation_2611_windows/validation_report.json gds/2611_window_validation.json
          cp validation_2611_alignment/validation_report.json gds/2611_alignment_validation.json
          git config user.name 'chatgpt-runner'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 2611_tapered_yue_dual_resist.py validate_2611_sweep.py validate_2611_windows.py gds/2611_tapered_yue_dual_resist_L10_L12.gds gds/2611_sweep_validation.json gds/2611_window_validation.json gds/2611_alignment_validation.json
          git commit -m 'Align complete 2611 devices by left meander bend without changing geometry'
          git push
