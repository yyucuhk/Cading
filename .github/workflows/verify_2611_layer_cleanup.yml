name: Verify selective L6000 layer cleanup
on:
  push:
    branches: [layout/2611-L6000-clean-layers]
    paths: [.github/workflows/verify_2611_layer_cleanup.yml]
jobs:
  verify:
    if: github.event.head_commit.message == 'Build cleaned L6000 comparison layers'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Preserve prior comparison and protect all unrelated files
        run: |
          mkdir -p validation_2611_layer_cleanup
          cp gds/2611_design1_L6000_P10_straight_output_comparison.gds /tmp/2611_layer_cleanup_baseline.gds
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,subprocess
          allow={'2611_design1_L6000_straight_output.py','DESIGN1_STRAIGHT_OUTPUT_README.txt','validate_2611_straight_output_raw.py','gds/2611_design1_L6000_P10_straight_output_comparison.gds','gds/2611_design1_L6000_P10_straight_output_comparison.json','gds/2611_design1_L6000_P10_straight_output_comparison.csv','gds/2611_straight_output_raw_validation.json'}
          paths=subprocess.check_output(['git','ls-tree','-r','--name-only','ff4159486c0c6ecab7054b7f6d59a39ff07eefcd'],text=True).splitlines()
          hashes={p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in paths if p not in allow}
          Path('/tmp/2611_protected.json').write_text(json.dumps(hashes,indent=2))
          PY
      - name: Apply guarded builder and validator updates
        run: python _apply_2611_layer_cleanup.py
      - name: Install approved long-layout engine
        run: python -m pip install gdsfactory==9.45.0 klayout==0.30.13 numpy==2.4.6
      - name: Regenerate the six-device comparison
        run: python 2611_design1_L6000_straight_output.py
      - name: Audit raw GDS geometry and complete layer-only preservation
        run: |
          python validate_2611_straight_output_raw.py
          python validate_2611_layer_cleanup.py --baseline /tmp/2611_layer_cleanup_baseline.gds --render
          cp validation_2611_straight_output/raw_gds_audit.json gds/2611_straight_output_raw_validation.json
      - name: Verify other layouts unchanged and record evidence
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          protected=json.loads(Path('/tmp/2611_protected.json').read_text())
          changed=[p for p,h in protected.items() if hashlib.sha256(Path(p).read_bytes()).hexdigest()!=h]
          assert not changed, changed
          p=Path('gds/2611_layer_cleanup_validation.json');r=json.loads(p.read_text())
          r.update(base_commit='ff4159486c0c6ecab7054b7f6d59a39ff07eefcd',protected_original_file_count=len(protected),other_original_files_unchanged=True)
          p.write_text(json.dumps(r,indent=2))
          print('PROTECTED FILES',len(protected))
          print('LAYER CLEANUP',r['check_count'],'checks; marker polygons',r['moved_marker_polygons'])
          print('OUTPUT SHA256',r['gds_sha256'])
          PY
      - name: Upload checked code GDS and previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 2611-L6000-layer-cleanup-release
          path: |
            2611_design1_L6000_straight_output.py
            2611_design1_L6000_P10_width_sweep.py
            2611_tapered_yue_dual_resist.py
            DESIGN1_STRAIGHT_OUTPUT_README.txt
            validate_2611_layer_cleanup.py
            validate_2611_straight_output_raw.py
            layers.py
            markers.py
            phononics.py
            routing.py
            tapered_local.py
            tether_variants.py
            tether_variants.gds
            text.py
            gds/2611_design1_L6000_P10_straight_output_comparison.*
            gds/2611_design1_L6000_P10_width_sweep.gds
            gds/2611_design1_L6000_P10_width_sweep.json
            gds/2611_straight_output_raw_validation.json
            gds/2611_layer_cleanup_validation.json
            validation_2611_layer_cleanup/
            validation_2611_straight_output/*.png
            validation_2611_straight_output/*.log
          if-no-files-found: error
      - name: Save validated files and remove temporary migration and workflow
        run: |
          git config user.name 'chatgpt-runner'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 2611_design1_L6000_straight_output.py DESIGN1_STRAIGHT_OUTPUT_README.txt validate_2611_straight_output_raw.py validate_2611_layer_cleanup.py
          git add gds/2611_design1_L6000_P10_straight_output_comparison.gds gds/2611_design1_L6000_P10_straight_output_comparison.json gds/2611_design1_L6000_P10_straight_output_comparison.csv gds/2611_straight_output_raw_validation.json gds/2611_layer_cleanup_validation.json
          git rm _apply_2611_layer_cleanup.py .github/workflows/verify_2611_layer_cleanup.yml
          git commit -m 'Remove L16 and L51 and move only global L2 markers to L15 in L6000 comparison'
          git push
