name: Verify three equal meander straights
on:
  push:
    branches: [layout/2611-equal-meander-straights]
jobs:
  verify:
    if: github.event.head_commit.message == 'Build and validate equal meander straights'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned geometry engine
        run: python -m pip install gdsfactory==9.45.0 matplotlib
      - name: Capture every original end assembly and complete layout
        run: python validate_2611_equal_straights.py capture
      - name: Apply guarded per-device equal-straight parameters
        run: |
          python _equalize_2611_once.py
          python -m py_compile 2611_tapered_yue_dual_resist.py 2611_tapered_yue_design2.py validate_2611_equal_straights.py validate_2611_design2_stages.py
      - name: Verify measured straights all layers both ends and regenerate GDS
        run: python validate_2611_equal_straights.py
      - name: Verify unchanged Design 2 taper stage geometry
        run: |
          python validate_2611_design2.py
          cp validation_2611_design2/validation_report.json gds/2611_design2_validation.json
      - name: Run both normal entry points and count-aware layer checks
        run: |
          python 2611_tapered_yue_dual_resist.py
          python 2611_tapered_yue_design2.py
          python validate_2611_cleanup.py
      - name: Upload measured geometry and downloadable files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 2611-equal-straights-review
          path: |
            2611_tapered_yue_dual_resist.py
            2611_tapered_yue_design2.py
            CAD_EDITING_GUIDE.md
            DESIGN2_README.md
            validate_2611_equal_straights.py
            validate_2611_design2_stages.py
            gds/2611_tapered_yue_dual_resist_L10_L12.gds
            gds/2611_tapered_yue_design2.gds
            gds/2611_equal_straights_validation.json
            gds/2611_design2_validation.json
            validation_2611_equal_straights/
            validation_2611_design2/
            validation_2611_cleanup/validation_report.json
      - name: Commit only verified source GDS and reports
        run: |
          git config user.name "chatgpt-runner"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 2611_tapered_yue_dual_resist.py 2611_tapered_yue_design2.py CAD_EDITING_GUIDE.md DESIGN2_README.md validate_2611_design2_stages.py gds/2611_tapered_yue_dual_resist_L10_L12.gds gds/2611_tapered_yue_design2.gds gds/2611_equal_straights_validation.json gds/2611_design2_validation.json
          git commit -m "Generate both designs with three equal meander straights"
          git push
