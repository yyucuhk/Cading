name: Run 2611 cleaned Layer2 merge
# rerun after removing obsolete post-merge repair

on:
  push:

jobs:
  run-2611:
    if: github.event.head_commit.message == 'Run 2611 cleaned layer2 merge'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install gdsfactory==9.45.0 numpy klayout
      - name: Run layout generator
        run: python 2611_tapered_yue_dual_resist.py
      - name: Verify cleaned Layer 2 and Layer 14 coverage
        run: |
          test -s gds/2611_tapered_yue_dual_resist_L10_L12.gds
          python - <<'PY'
          import klayout.db as kdb

          path = "gds/2611_tapered_yue_dual_resist_L10_L12.gds"
          ly = kdb.Layout()
          ly.read(path)
          top = ly.top_cell()
          dbu = ly.dbu

          l2 = kdb.Region(top.begin_shapes_rec(ly.layer(2, 0)))
          l14 = kdb.Region(top.begin_shapes_rec(ly.layer(14, 0)))
          l2.merge()
          l14.merge()

          # First-device region around the requested x ~ -422 um tip.
          roi = kdb.Region(kdb.Box(
              int(round(-460/dbu)),
              int(round(-940/dbu)),
              int(round(-380/dbu)),
              int(round(-860/dbu)),
          ))
          local_l2 = l2 & roi
          local_l14 = l14 & roi
          missing = local_l2 - local_l14
          missing.merge()

          print("local L2 area um2:", local_l2.area()*dbu*dbu)
          print("local L14 area um2:", local_l14.area()*dbu*dbu)
          print("local L2 not covered by L14 um2:", missing.area()*dbu*dbu)

          # The former rectangular companion-block zones around the Layer-10
          # tip markers. These should no longer contain Layer-2 geometry.
          block_zones = [
              (-422.47, -911.30, -420.47, -903.30),
              (-422.47, -896.70, -420.47, -888.70),
          ]
          for i, (x1,y1,x2,y2) in enumerate(block_zones):
              zone = kdb.Region(kdb.Box(
                  int(round(x1/dbu)), int(round(y1/dbu)),
                  int(round(x2/dbu)), int(round(y2/dbu)),
              ))
              print(f"block zone {i} L2 overlap um2:", (l2 & zone).area()*dbu*dbu)
              print(f"block zone {i} L14 overlap um2:", (l14 & zone).area()*dbu*dbu)
          PY
      - name: Commit generated GDS
        run: |
          git config user.name "chatgpt-runner"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gds/2611_tapered_yue_dual_resist_L10_L12.gds
          if git diff --cached --quiet; then
            echo "No GDS changes to commit."
          else
            git commit -m "Regenerate GDS with cleaned Layer 2 merged into Layer 14"
            git push
          fi
