name: Verify twelve L6000 devices and final release masks
on:
  push:
    branches: [layout/2611-L6000-four-sets-final-masks]
    paths: [.github/workflows/verify_2611_four_sets.yml]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Preserve baseline and protect unrelated files
        run: |
          git fetch origin 45b8c0d149cf9a6fea5e0d7da90dbbb9afaeb3fa --depth=1
          mkdir -p baseline
          cp gds/2611_design1_L6000_P10_straight_output_comparison.gds baseline/comparison.gds
          python - <<'PY'
          import subprocess,hashlib,json
          from pathlib import Path
          paths=subprocess.check_output(['git','ls-tree','-r','--name-only','45b8c0d149cf9a6fea5e0d7da90dbbb9afaeb3fa'],text=True).splitlines()
          mutable={'2611_design1_L6000_straight_output.py','DESIGN1_STRAIGHT_OUTPUT_README.txt','validate_2611_release_offset.py','gds/2611_release_offset_validation.json'}
          mutable.update('gds/2611_design1_L6000_P10_straight_output_comparison'+x for x in ('.gds','.json','.csv'))
          protected={p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in paths if p not in mutable}
          Path('baseline/protected.json').write_text(json.dumps(protected))
          assert hashlib.sha256(Path('baseline/comparison.gds').read_bytes()).hexdigest()=='c82536e2dbe467fc8f3d8e3c5586371353593bc8e027a47c69969f1d9775ffc4'
          PY
      - name: Apply reviewed mask and assembly functions
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast,hashlib
          p=Path('2611_design1_L6000_straight_output.py');s=p.read_text();original=s
          assert hashlib.sha1(b'blob '+str(len(s.encode())).encode()+b'\0'+s.encode()).hexdigest()=='0a04493410353061bd09460a2ca89e48667987ba'
          s=s.replace('LAYER2_WINDOW_MARGIN = 1.0','LAYER2_WINDOW_MARGIN = 2.5').replace('LAYER14_WINDOW_MARGIN = 1.0','LAYER14_WINDOW_MARGIN = 2.5')
          old='RELEASE_WINDOW_START_OFFSET = 0.0     # start BOTH masks exactly at the Layer 10 entrance'
          assert s.count(old)==1
          s=s.replace(old,'RELEASE_WINDOW_START_OFFSET = 0.0     # legacy construction setting; see independent offsets below\nLAYER2_START_OFFSET = 0.5             # preserve original L10-to-L2 delayed-copy interface\nLAYER14_START_OFFSET = 0.0            # same entrance as L10\nLAYER2_START_WIDTH = 15.0             # TOTAL entrance width, not extra margin\nLAYER14_START_WIDTH = 8.0             # TOTAL entrance width, not extra margin')
          replacement=Path('_four_sets_functions.py').read_text()
          parts={n.name:'\n'.join(replacement.splitlines()[n.lineno-1:n.end_lineno]) for n in ast.parse(replacement).body if isinstance(n,ast.FunctionDef)}
          for n in reversed(ast.parse(s).body):
              if isinstance(n,ast.FunctionDef) and n.name in parts:
                  lines=s.splitlines();lines[n.lineno-1:n.end_lineno]=parts.pop(n.name).splitlines();s='\n'.join(lines)+'\n'
          insert='\n\n'.join(parts.values())+'\n\n'
          s=s.replace('# %% [06] Entry point: one isolated process per width',insert+'# %% [06] Entry point: one isolated process per width')
          start=s.index('"""');end=s.index('"""',start+3)+3
          doc='Design 1 L6000: four three-width sets (12 devices), all dimensions in um.\n\nTwo meander sets and two single-straight sets. New single straights are 6000 um\nwith two couplers, or one input coupler plus the retained 2000 um bare output.\nComplete optical terminal assemblies are copied, never redrawn.\nL2 starts 0.5 um outward from L10, at TOTAL width 15 um.\nL14 starts with L10, at TOTAL width 8 um. Both downstream margins are 2.5 um\nper side. First-stage window envelopes blend smoothly over the original stage.\nL11/L16/L51 are absent; global marks are on L15 and labels on L2.\nRequires the existing source modules and source width-sweep GDS/manifest.\n'
          s=s[:start]+'"""'+doc+'"""'+s[end:]
          for n in reversed(ast.parse(s).body):
              if isinstance(n,ast.FunctionDef) and n.name=='render':
                  lines=s.splitlines();lines[n.lineno-1:n.end_lineno]=['def render(ly,top,result):','    """Render actual exported polygons using the independent reader."""','    from validate_2611_four_sets import render as render_saved','    render_saved(ROOT)'];s='\n'.join(lines)+'\n'
          s=s.replace('    combine()\n','    combine()\n    from validate_2611_four_sets import validate, render as render_saved\n    validate(ROOT)\n    render_saved(ROOT)\n')
          ast.parse(s)
          a={n.name:ast.dump(n,include_attributes=False) for n in ast.parse(original).body if isinstance(n,ast.FunctionDef)}
          b={n.name:ast.dump(n,include_attributes=False) for n in ast.parse(s).body if isinstance(n,ast.FunctionDef)}
          assert {n for n in a if a[n]!=b[n]}=={'finalize_coupler_windows','combine','render','main'}
          p.write_text(s)
          Path('DESIGN1_STRAIGHT_OUTPUT_README.txt').write_text('L6000 FOUR-SET COMPARISON\n\nRun: python 2611_design1_L6000_straight_output.py\nOutput: gds/2611_design1_L6000_P10_straight_output_comparison.gds\n\nBottom to top: three meander/two-coupler devices, three meander/one-coupler\ndevices, three single-straight/two-coupler devices, three single-straight/\none-coupler devices. Each set sweeps widths 1.62, 1.64, 1.68 um.\n600 um row pitch; original six origins unchanged. New straight center\nsections are 6000 um, NOT the approximately 18.742 mm total meander path.\nOne-coupler sets retain a 2000 um bare extension, giving 8000 um in the\nnew bend-free route, excluding the retained input transition/taper.\n\nLayer 2 starts 0.5 um outward from Layer 10: global input X=-803.347 um\nand output X=5287.653 um. Layer 14 starts with L10: -802.847/5287.153 um.\nThe 0.5 um original delayed-copy interface is retained, not doubled.\nEntrance widths are TOTAL widths: L2=15 um, L14=8 um. Both downstream\nexpansions are 2.5 um per side. These margins do not add another 5 um\nto the stated entrance widths. The smooth entrance blend joins the\noriginal downstream mask generator; distant channels and pads stay unchanged.\n\nSection 01 controls widths, start offsets and margins. The default width\nsweep uses the approved source GDS; new widths require regenerating that\nsource and manifest first. Four-set default requires reference devices.\nNo L11, L16, L51 anywhere. Labels remain L2; global markers remain L15.\nOld P10 text in the existing six labels is only a legacy source identifier.\nFrame height increases for the additional rows; optical couplers and the\nfirst six device placements remain unchanged.\n\nIndependent check: python validate_2611_four_sets.py --render\nGeometry checks are not optical, mechanical or full fabrication DRC.\n')
          Path('validate_2611_release_offset.py').write_text('"""Compatibility entrypoint; current layout has four sets."""\nfrom validate_2611_four_sets import validate, render\nfrom pathlib import Path\nimport argparse\nif __name__=="__main__":\n    p=argparse.ArgumentParser();p.add_argument("--root",type=Path,default=Path(__file__).resolve().parent);p.add_argument("--baseline",type=Path);p.add_argument("--render",action="store_true");a=p.parse_args();validate(a.root,a.baseline)\n    if a.render:render(a.root)\n')
          Path('gds/2611_release_offset_validation.json').write_text('{"status":"SUPERSEDED","current_report":"2611_four_sets_validation.json"}\n')
          PY
          python -m py_compile 2611_design1_L6000_straight_output.py validate_2611_four_sets.py
      - name: Install approved CAD engine
        run: python -m pip install gdsfactory==9.45.0 klayout==0.30.13 kfactory==2.6.1 numpy==2.4.6 shapely matplotlib
      - name: Build and inspect twelve devices
        run: python 2611_design1_L6000_straight_output.py
      - name: Independently compare original optics and new straight sets
        run: python validate_2611_four_sets.py --baseline baseline/comparison.gds --render
      - name: Verify protected sources and record output hashes
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          protected=json.loads(Path('baseline/protected.json').read_text())
          assert all(hashlib.sha256(Path(p).read_bytes()).hexdigest()==h for p,h in protected.items())
          p=Path('gds/2611_four_sets_validation.json');r=json.loads(p.read_text());r.update(protected_unrelated_file_count=len(protected),unrelated_files_unchanged=True,base_commit='45b8c0d149cf9a6fea5e0d7da90dbbb9afaeb3fa');p.write_text(json.dumps(r,indent=2))
          assert r['status']=='PASS'
          PY
      - name: Upload source GDS validation and actual previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 2611-L6000-four-sets-final
          path: |
            2611_design1_L6000_straight_output.py
            2611_design1_L6000_P10_width_sweep.py
            2611_tapered_yue_dual_resist.py
            DESIGN1_STRAIGHT_OUTPUT_README.txt
            validate_2611_four_sets.py
            validate_2611_release_offset.py
            validate_2611_straight_output_raw.py
            validate_2611_coupler_release.py
            layers.py
            markers.py
            phononics.py
            routing.py
            tapered_local.py
            tether_variants.py
            tether_variants.gds
            text.py
            gds/2611_design1_L6000_P10_straight_output_comparison.*
            gds/2611_design1_L6000_P10_width_sweep.*
            gds/2611_four_sets_validation.json
            gds/2611_release_offset_validation.json
            validation_2611_four_sets/*.png
      - name: Save passing changes and remove one-use files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm _four_sets_functions.py .github/workflows/verify_2611_four_sets.yml
          git add 2611_design1_L6000_straight_output.py DESIGN1_STRAIGHT_OUTPUT_README.txt validate_2611_four_sets.py validate_2611_release_offset.py gds/2611_design1_L6000_P10_straight_output_comparison.gds gds/2611_design1_L6000_P10_straight_output_comparison.json gds/2611_design1_L6000_P10_straight_output_comparison.csv gds/2611_four_sets_validation.json gds/2611_release_offset_validation.json
          git commit -m 'Save verified four-set L6000 layout and final overlap/window settings'
          git push
