name: Verify 1 um release masks and 10 um setback
on:
  push:
    branches: [layout/2611-L6000-mask-margin-offset]
    paths: [.github/workflows/verify_2611_release_offset.yml]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Preserve approved layout and protect unrelated files
        run: |
          git fetch origin 0ec81da14294151fb4b12d06baf942926675d19b --depth=1
          mkdir -p baseline
          cp gds/2611_design1_L6000_P10_straight_output_comparison.gds baseline/comparison.gds
          python - <<'PY'
          import subprocess,hashlib,json
          from pathlib import Path
          paths=subprocess.check_output(['git','ls-tree','-r','--name-only','0ec81da14294151fb4b12d06baf942926675d19b'],text=True).splitlines()
          mutable={'2611_design1_L6000_straight_output.py','DESIGN1_STRAIGHT_OUTPUT_README.txt','validate_2611_coupler_release.py','gds/2611_design1_L6000_P10_straight_output_comparison.gds','gds/2611_design1_L6000_P10_straight_output_comparison.json','gds/2611_coupler_release_validation.json'}
          protected={p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in paths if p not in mutable}
          Path('baseline/protected.json').write_text(json.dumps(protected))
          PY
      - name: Apply guarded release-mask-only source change
        run: |
          python _update_2611_release_offset_once.py
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('2611_design1_L6000_straight_output.py')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='182959772f6e354688d2fe48ae7917c4242d49b5730f85c15d0c9f4fdead288b'
          PY
      - name: Install approved CAD engine
        run: python -m pip install gdsfactory==9.45.0 klayout==0.30.13 kfactory==2.6.1 numpy==2.4.6 shapely matplotlib
      - name: Regenerate the six-device comparison
        run: python 2611_design1_L6000_straight_output.py
      - name: Independently inspect saved polygons and preservation
        run: python validate_2611_release_offset.py --baseline baseline/comparison.gds --render
      - name: Record evidence and refresh current editing instructions
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,hashlib
          protected=json.loads(Path('baseline/protected.json').read_text())
          changed=[p for p,h in protected.items() if hashlib.sha256(Path(p).read_bytes()).hexdigest()!=h]
          assert not changed, changed
          report_path=Path('gds/2611_release_offset_validation.json')
          report=json.loads(report_path.read_text())
          report.update(base_commit='0ec81da14294151fb4b12d06baf942926675d19b',protected_unrelated_file_count=len(protected),unrelated_files_unchanged=True,build_engine_versions={'gdsfactory':'9.45.0','klayout':'0.30.13','kfactory':'2.6.1','numpy':'2.4.6'})
          report_path.write_text(json.dumps(report,indent=2))
          Path('gds/2611_coupler_release_validation.json').write_text(json.dumps({'status':'SUPERSEDED','current_report':'gds/2611_release_offset_validation.json','reason':'Both release masks now have 1 um margins and a 10 um start offset'},indent=2))
          Path('validate_2611_coupler_release.py').write_text('"""Compatibility entrypoint: current release-margin and setback audit."""\nfrom validate_2611_release_offset import validate, render\nif __name__ == "__main__":\n    import argparse\n    from pathlib import Path\n    p=argparse.ArgumentParser(description=__doc__)\n    p.add_argument("--root",type=Path,default=Path(__file__).resolve().parent)\n    p.add_argument("--baseline",type=Path)\n    p.add_argument("--render",action="store_true")\n    a=p.parse_args();validate(a.root,a.baseline)\n    if a.render:render(a.root)\n')
          Path('DESIGN1_STRAIGHT_OUTPUT_README.txt').write_text('''CURRENT SIX-DEVICE L6000 COMPARISON

Run from the existing Cading folder:
    python 2611_design1_L6000_straight_output.py

Section 01 controls:
    LAYER2_WINDOW_MARGIN = 1.0
    LAYER14_WINDOW_MARGIN = 1.0
    RELEASE_WINDOW_START_OFFSET = 10.0

Both margin settings are in um, per side. They use the existing smooth
first-stage mask blend and 1 um expansion on the downstream narrow taper;
this does not replace the entire first-stage opening by a constant offset.
The 10 um setting is a longitudinal setback measured OUTWARD from each
actual Layer10 taper entrance. It does not move or shorten the optical
waveguide. The first 10 um of each Layer10 taper has no L2/L14 release mask.
For the current geometry, local starts are -3055 um (input) and +3055 um
(output). Global starts are -812.847 um and +5297.153 um, respectively.

Applies to all six devices / nine tapered ends: two windows on each of
the three two-coupler devices, one input window on each of the three
straight-output variants. The bare 2000 um output stays unchanged.
Long channels and pads keep their original definitions. Existing optical
profiles, widths, alignment tips, labels and placements are unchanged.
Layers 11/16/51 remain absent. Global alignment markers remain on L15;
all six device labels remain on L2. The historical P10 label is retained
as an identifier only; the final layout contains no Layer11 PNC shapes.

The source GDS, standalone designs, and 18-device sweep are not modified.
The builder depends on the original source GDS and its manifest and the
supporting Python modules in this repository. It never overwrites them.

Output:
    gds/2611_design1_L6000_P10_straight_output_comparison.gds
Independent saved-geometry audit:
    python validate_2611_release_offset.py --baseline PREVIOUS.gds --render
Current report:
    gds/2611_release_offset_validation.json

Build engine: gdsfactory 9.45.0; KLayout 0.30.13; kfactory 2.6.1;
NumPy 2.4.6. Geometry checks are not optical/mechanical simulation or
full fabrication-rule qualification.
''')
          PY
      - name: Upload generated code GDS and geometry previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 2611-L6000-release-offset
          path: |
            2611_design1_L6000_straight_output.py
            DESIGN1_STRAIGHT_OUTPUT_README.txt
            validate_2611_release_offset.py
            validate_2611_coupler_release.py
            gds/2611_design1_L6000_P10_straight_output_comparison.*
            gds/2611_release_offset_validation.json
            gds/2611_coupler_release_validation.json
            validation_2611_release_offset/
            validation_2611_straight_output/
      - name: Save only validated changes and remove temporary runner
        run: |
          git config user.name 'chatgpt-runner'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm _update_2611_release_offset_once.py .github/workflows/verify_2611_release_offset.yml
          git add 2611_design1_L6000_straight_output.py DESIGN1_STRAIGHT_OUTPUT_README.txt validate_2611_release_offset.py validate_2611_coupler_release.py gds/2611_design1_L6000_P10_straight_output_comparison.gds gds/2611_design1_L6000_P10_straight_output_comparison.json gds/2611_release_offset_validation.json gds/2611_coupler_release_validation.json
          git commit -m 'Save verified 1 um release masks with 10 um taper-start setback'
          git push
