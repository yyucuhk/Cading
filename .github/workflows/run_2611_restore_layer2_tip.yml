name: Run 2611 GDS generation

on:
  push:

jobs:
  run-2611:
    if: github.event.head_commit.message == 'Run 2611 restore layer2 tip pattern'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install gdsfactory==9.45.0 numpy
      - name: Run layout generator
        run: python 2611_tapered_yue_dual_resist.py
      - name: Verify output
        run: |
          ls -lh gds
          test -s gds/2611_tapered_yue_dual_resist_L10_L12.gds
      - name: Commit generated GDS
        run: |
          git config user.name "chatgpt-runner"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gds/2611_tapered_yue_dual_resist_L10_L12.gds
          if git diff --cached --quiet; then
            echo "No GDS changes to commit."
          else
            git commit -m "Regenerate GDS with restored Layer 2 tip pattern"
            git push
          fi
