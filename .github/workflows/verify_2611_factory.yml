name: Verify independent all-layer 2611 factory
on:
  push:
    branches: [fix/2611-independent-all-layer-sweep]
defaults:
  run:
    shell: bash
jobs:
  verify:
    if: github.event.head_commit.message == 'Validate independent all-layer 2611 sweep'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned layout engine
        run: python -m pip install gdsfactory==9.45.0 matplotlib
      - name: Capture original approved bottom from unchanged main
        run: |
          git fetch origin main:refs/remotes/origin/main --depth=1
          cp 2611_tapered_yue_dual_resist.py "$RUNNER_TEMP/candidate2611.py"
          trap 'cp "$RUNNER_TEMP/candidate2611.py" 2611_tapered_yue_dual_resist.py' EXIT
          git show origin/main:2611_tapered_yue_dual_resist.py > 2611_tapered_yue_dual_resist.py
          python _refactor_2611_once.py baseline | tee baseline_audit.log
      - name: Prepare independent factory and complete-end test regions
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          source=Path('2611_tapered_yue_dual_resist.py').read_text()
          if 'def make_device(' not in source:
              subprocess.run(['python','_refactor_2611_once.py','apply'],check=True)
          p=Path('validate_2611_sweep.py')
          s=p.read_text()
          s=s.replace('(-10000, 0, -m.S_BEND_HALF_LENGTH, 1000)', '(-10000, 25, -m.S_BEND_HALF_LENGTH, 1000)')
          s=s.replace('(m.S_BEND_HALF_LENGTH, -1000, 10000, 0)', '(m.S_BEND_HALF_LENGTH, -1000, 10000, -25)')
          s=s.replace('# The meander occupies the opposite half-planes; no small tip patches.', '# Exclude the variable middle meander at y=0, including its side bands.\n    # Both full end assemblies (including the 150 um radius glue windows\n    # centered at y=+/-200) remain inside these complete-end test regions.')
          p.write_text(s)
          PY
          python -m py_compile 2611_tapered_yue_dual_resist.py validate_2611_sweep.py
      - name: Validate complete layers, both ends, and all junctions
        run: python validate_2611_sweep.py | tee validation_audit.log
      - name: Upload candidate and geometry review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-all-layer-2611-review
          path: |
            2611_tapered_yue_dual_resist.py
            validate_2611_sweep.py
            gds/2611_tapered_yue_dual_resist_L10_L12.gds
            validation_2611/
            baseline_audit.log
            validation_audit.log
      - name: Commit only passing candidate to repair branch
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('validation_2611/validation_report.json').read_text())
          assert r['status']=='PASS' and not r['failures'], r
          PY
          cp validation_2611/validation_report.json gds/2611_sweep_validation.json
          git config user.name 'chatgpt-runner'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 2611_tapered_yue_dual_resist.py validate_2611_sweep.py gds/2611_tapered_yue_dual_resist_L10_L12.gds gds/2611_sweep_validation.json
          if ! git diff --cached --quiet; then
            git commit -m 'Validate all-layer factory against full end assemblies and bottom reference'
            git push
          fi
