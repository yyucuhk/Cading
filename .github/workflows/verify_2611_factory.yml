name: Verify independent all-layer 2611 factory
on:
  push:
    branches: [fix/2611-independent-all-layer-sweep]
jobs:
  verify:
    if: github.event.head_commit.message == 'Validate independent all-layer 2611 sweep'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned layout engine
        run: python -m pip install gdsfactory==9.45.0 matplotlib
      - name: Capture approved bottom before refactoring
        run: python _refactor_2611_once.py baseline | tee baseline_audit.log
      - name: Refactor into one independent device factory
        run: |
          python _refactor_2611_once.py apply
          python -m py_compile 2611_tapered_yue_dual_resist.py validate_2611_sweep.py
          git diff --stat
      - name: Validate complete layers, both ends, and all junctions
        run: python validate_2611_sweep.py | tee validation_audit.log
      - name: Upload candidate and geometry review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-all-layer-2611-review
          path: |
            2611_tapered_yue_dual_resist.py
            validate_2611_sweep.py
            gds/2611_tapered_yue_dual_resist_L10_L12.gds
            validation_2611/
            baseline_audit.log
            validation_audit.log
      - name: Commit only validated source and GDS to repair branch
        run: |
          cp validation_2611/validation_report.json gds/2611_sweep_validation.json
          git config user.name 'chatgpt-runner'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 2611_tapered_yue_dual_resist.py gds/2611_tapered_yue_dual_resist_L10_L12.gds gds/2611_sweep_validation.json
          git commit -m 'Build all layers independently for each meander sweep device'
          git push
