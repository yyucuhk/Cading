name: Verify local five-period PNC reinforcement
on:
  push:
    branches: [layout/2611-dense-connection-pnc]
    paths: [.github/workflows/verify_2611_dense_connections.yml]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install approved short-layout geometry engine
        run: python -m pip install gdsfactory==9.45.0 kfactory==2.6.1 klayout==0.30.12 numpy==2.4.6
      - name: Preserve all four approved GDS baselines
        run: python validate_2611_taper_pitch.py capture
      - name: Apply localized connection PNC controls and regression tests
        run: |
          python _dense_connections_once.py
          python -m py_compile 2611_tapered_yue_dual_resist.py 2611_tapered_yue_design2.py 2611_build_combined_sweep.py 2611_design1_L6000_P10_width_sweep.py validate_2611_taper_pitch.py
      - name: Regenerate both standalone designs and 18-device vertical sweep
        run: |
          python 2611_tapered_yue_dual_resist.py
          python 2611_tapered_yue_design2.py
          python 2611_build_combined_sweep.py
      - name: Regenerate 6000 um width sweep using its approved geometry engine
        run: |
          python -m pip install klayout==0.30.13
          python 2611_design1_L6000_P10_width_sweep.py
      - name: Recheck complete ends connectivity placement labels and straight PNCs
        run: |
          python validate_2611_combined_sweep.py
          python validate_2611_vertical_sweep.py
          python validate_2611_straight_pitch.py
      - name: Measure five 1 um periods and prove all other geometry unchanged
        run: python validate_2611_taper_pitch.py
      - name: Record engine versions and localized validation summary
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('gds/2611_taper_pitch_validation.json')
          report=json.loads(p.read_text())
          assert report['status']=='PASS' and report['baseline_comparison_performed']
          assert report['devices_checked']==23 and report['taper_ends_checked']==46
          report['base_commit']='1272b7a5e0dc2e1090f42621a720bd6fc5e064c1'
          report['build_engine_versions']={
            'short':{'gdsfactory':'9.45.0','kfactory':'2.6.1','klayout':'0.30.12','numpy':'2.4.6'},
            'long':{'gdsfactory':'9.45.0','kfactory':'2.6.1','klayout':'0.30.13','numpy':'2.4.6'}}
          p.write_text(json.dumps(report,indent=2))
          Path('validation_2611_taper_pitch/validation_report.json').write_text(p.read_text())
          print('PASS',report['check_count'],'checks;',report['taper_ends_checked'],'taper ends')
          PY
      - name: Upload updated code GDS files and measured previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 2611-dense-connection-pnc-release
          if-no-files-found: error
          path: |
            2611_tapered_yue_dual_resist.py
            2611_tapered_yue_design2.py
            2611_build_combined_sweep.py
            2611_design1_L6000_P10_width_sweep.py
            validate_2611_taper_pitch.py
            CAD_EDITING_GUIDE.md
            COMBINED_SWEEP_README.md
            DESIGN1_L6000_WIDTH_SWEEP_README.md
            gds/2611_tapered_yue_dual_resist_L10_L12.gds
            gds/2611_tapered_yue_design2.gds
            gds/2611_design1_design2_L1400_18device_sweep.*
            gds/2611_design1_L6000_P10_width_sweep.*
            gds/2611_taper_pitch_validation.json
            gds/2611_combined_sweep_validation.json
            gds/2611_vertical_sweep_validation.json
            gds/2611_straight_pitch_validation.json
            validation_2611_taper_pitch/*.png
            validation_2611_taper_pitch/validation_report.json
            validation_2611_combined_sweep/*.log
      - name: Commit only validated changes and remove temporary runner
        run: |
          git config user.name 'chatgpt-runner'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 2611_tapered_yue_dual_resist.py 2611_tapered_yue_design2.py 2611_build_combined_sweep.py 2611_design1_L6000_P10_width_sweep.py validate_2611_taper_pitch.py CAD_EDITING_GUIDE.md COMBINED_SWEEP_README.md DESIGN1_L6000_WIDTH_SWEEP_README.md
          git add gds/2611_tapered_yue_dual_resist_L10_L12.gds gds/2611_tapered_yue_design2.gds gds/2611_design1_design2_L1400_18device_sweep.gds gds/2611_design1_design2_L1400_18device_sweep.json gds/2611_design1_L6000_P10_width_sweep.gds gds/2611_design1_L6000_P10_width_sweep.json gds/2611_taper_pitch_validation.json gds/2611_combined_sweep_validation.json gds/2611_vertical_sweep_validation.json gds/2611_straight_pitch_validation.json
          git rm _dense_connections_once.py .github/workflows/verify_2611_dense_connections.yml
          git commit -m 'Add validated five-period 1 um PNC connection segments; preserve all remaining geometry'
          git push
