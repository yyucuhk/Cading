name: Verify original-design post-PNC windows
on:
  push:
    branches: [layout/2611-original-designs-narrow-L14]
    paths: [.github/workflows/verify_original_design_windows.yml]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Preserve approved geometry and unrelated files
        run: |
          git fetch origin f97b428f7be18a6bab050ef6ddb884d5a0080878 --depth=1
          mkdir -p baseline
          python - <<'PY'
          import subprocess,hashlib,json,shutil
          from pathlib import Path
          files=['2611_tapered_yue_dual_resist_L10_L12.gds','2611_tapered_yue_design2.gds','2611_design1_design2_L1400_18device_sweep.gds']
          for f in files:shutil.copy2(Path('gds')/f,Path('baseline')/f)
          mutable={'2611_tapered_yue_dual_resist.py','2611_tapered_yue_design2.py','2611_build_combined_sweep.py','gds/2611_design1_design2_L1400_18device_sweep.json'}|{'gds/'+f for f in files}
          paths=subprocess.check_output(['git','ls-tree','-r','--name-only','f97b428f7be18a6bab050ef6ddb884d5a0080878'],text=True).splitlines()
          protected={p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in paths if p not in mutable}
          Path('baseline/protected.json').write_text(json.dumps(protected))
          for p in ('2611_tapered_yue_dual_resist.py','2611_tapered_yue_design2.py','2611_build_combined_sweep.py'):shutil.copy2(p,Path('baseline')/p)
          PY
      - name: Apply guarded export-only edits
        run: |
          python _apply_original_windows.py
          python -m py_compile original_design_layer14.py validate_original_design_windows.py 2611_tapered_yue_dual_resist.py 2611_tapered_yue_design2.py 2611_build_combined_sweep.py
      - name: Install approved CAD engine
        run: python -m pip install gdsfactory==9.45.0 klayout==0.30.13 numpy==2.4.6 shapely matplotlib
      - name: Regenerate both standalone designs and combined sweep
        run: |
          python 2611_tapered_yue_dual_resist.py
          python 2611_tapered_yue_design2.py
          python 2611_build_combined_sweep.py
      - name: Independently inspect PNC regions and every retained layer
        run: python validate_original_design_windows.py --baseline baseline --render
      - name: Verify scope and document editable settings
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          protected=json.loads(Path('baseline/protected.json').read_text())
          changed=[p for p,h in protected.items() if hashlib.sha256(Path(p).read_bytes()).hexdigest()!=h]
          assert not changed,changed
          p=Path('gds/2611_original_design_windows_validation.json');report=json.loads(p.read_text())
          report.update(protected_unrelated_file_count=len(protected),unrelated_files_unchanged=True,base_commit='f97b428f7be18a6bab050ef6ddb884d5a0080878')
          p.write_text(json.dumps(report,indent=2))
          Path('ORIGINAL_DESIGN_LAYER14_README.txt').write_text('ORIGINAL DESIGN 1 AND DESIGN 2 - LAYER 14 ONLY\n\nRun the standalone scripts or 2611_build_combined_sweep.py normally.\nKeep original_design_layer14.py beside these scripts.\nSection 01: LAYER14_POST_PNC_MARGIN = 1.0; LAYER14_SIMPLE_TERMINAL_WINDOW = True.\n\nThe full 45 um PNC transition, its endpoint opening, meander and bend windows\nremain unchanged. At the PNC endpoint the optical-taper window starts at the\nexisting broad width and smoothly narrows across the first optical stage.\nThe remaining optical-taper opening has 1 um normal expansion per side.\nAt the final optical-taper tip, a linear channel starts at the current narrow\nopening width and reaches the existing outer endpoint and two 300 um circles.\nThe old rectangular frame is absent on Layer 14; Layer 2 is untouched.\n\nOnly standalone exports and the combined 18-device sweep call this final\nLayer-14 policy. Raw make_device() construction is unchanged so the L6000\nfamily retains its separate masks and all saved L6000 layouts remain untouched.\nThe current exported-geometry report is gds/2611_original_design_windows_validation.json.\nPrior reports describe earlier GDS revisions. These are geometric checks,\nnot optical/mechanical simulation or a complete fabrication DRC.\n')
          print('Unchanged protected files:',len(protected))
          PY
      - name: Upload inspected code GDS and previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-designs-narrow-L14
          path: |
            2611_tapered_yue_dual_resist.py
            2611_tapered_yue_design2.py
            2611_build_combined_sweep.py
            original_design_layer14.py
            validate_original_design_windows.py
            validate_2611_straight_output_raw.py
            ORIGINAL_DESIGN_LAYER14_README.txt
            layers.py
            markers.py
            phononics.py
            routing.py
            tapered_local.py
            tether_variants.py
            tether_variants.gds
            text.py
            gds/2611_tapered_yue_dual_resist_L10_L12.gds
            gds/2611_tapered_yue_design2.gds
            gds/2611_design1_design2_L1400_18device_sweep.*
            gds/2611_original_design_windows_validation.json
            validation_original_design_windows/
            validation_2611_combined_sweep/*.log
            baseline/
      - name: Save passing outputs and remove one-use helpers
        run: |
          git config user.name 'Yue YU'
          git config user.email '110512504+yyucuhk@users.noreply.github.com'
          git add 2611_tapered_yue_dual_resist.py 2611_tapered_yue_design2.py 2611_build_combined_sweep.py ORIGINAL_DESIGN_LAYER14_README.txt
          git add gds/2611_tapered_yue_dual_resist_L10_L12.gds gds/2611_tapered_yue_design2.gds gds/2611_design1_design2_L1400_18device_sweep.gds gds/2611_design1_design2_L1400_18device_sweep.json gds/2611_original_design_windows_validation.json
          git rm _apply_original_windows.py .github/workflows/verify_original_design_windows.yml
          git commit -m 'Save original-design 1 um windows with preserved PNC regions'
          git push origin HEAD:layout/2611-original-designs-narrow-L14
