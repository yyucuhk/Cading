name: Finalize common-start release windows
on:
  push:
    branches: [layout/2611-L6000-release-common-start]
    paths: [.github/workflows/finalize_2611_common_start.yml]
jobs:
  verify:
    if: github.event.head_commit.message == 'Verify original Layer 2 entrance detail and save common-start layouts'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Preserve approved baseline and unrelated-file hashes
        run: |
          git fetch origin 1683db53f6184134710859ce3375e5f77573ed80 --depth=1
          mkdir -p baseline
          cp gds/2611_design1_L6000_P10_straight_output_comparison.gds baseline/comparison.gds
          python - <<'PY'
          import subprocess,hashlib,json
          from pathlib import Path
          base='1683db53f6184134710859ce3375e5f77573ed80'
          mutable={'2611_design1_L6000_straight_output.py','DESIGN1_STRAIGHT_OUTPUT_README.txt','validate_2611_release_offset.py','gds/2611_design1_L6000_P10_straight_output_comparison.gds','gds/2611_design1_L6000_P10_straight_output_comparison.json','gds/2611_release_offset_validation.json'}
          paths=subprocess.check_output(['git','ls-tree','-r','--name-only',base],text=True).splitlines()
          protected={p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in paths if p not in mutable}
          Path('baseline/protected.json').write_text(json.dumps(protected))
          assert hashlib.sha256(Path('baseline/comparison.gds').read_bytes()).hexdigest()=='7c3cff27b8f008cba37179ac0ebe861457e1c2e46f628c1ec672f1879f660bee'
          PY
          python _apply_2611_common_start.py
      - uses: actions/download-artifact@v4
        with:
          name: 2611-L6000-common-start-release
          run-id: 42464464443
          github-token: ${{ github.token }}
          path: _generated
      - name: Verify source identity and keep the already generated GDS unchanged
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,shutil,ast
          generated=Path('_generated')
          for name in ('2611_design1_L6000_straight_output.py','DESIGN1_STRAIGHT_OUTPUT_README.txt','validate_2611_release_offset.py'):
              assert Path(name).read_bytes()==(generated/name).read_bytes(),name
          for suffix in ('.gds','.json'):
              name='gds/2611_design1_L6000_P10_straight_output_comparison'+suffix
              shutil.copy2(generated/name,name)
          assert hashlib.sha256(Path('gds/2611_design1_L6000_P10_straight_output_comparison.gds').read_bytes()).hexdigest()=='c82536e2dbe467fc8f3d8e3c5586371353593bc8e027a47c69969f1d9775ffc4'
          p=Path('validate_2611_release_offset.py')
          text=p.read_text()
          indent=' '*20
          old='\n'.join(indent+line for line in [
              "check(key+f'_L{layer}_smooth_first_stage_{distance}',",
              "      cut.geom_type=='LineString' and abs(cut.length/2-expected)<.0021,",
              "      measured_halfwidth_um=cut.length/2, expected_halfwidth_um=expected)"])
          new='\n'.join(indent+line for line in [
              '# Layer 2 intentionally retains two side bands before the',
              '# existing 0.5 um delayed slab copy. Test the OUTER envelope',
              '# and this original center gap; do not fill it to pass a test.',
              'split = layer == 2 and distance < .5',
              "kind = 'MultiLineString' if split else 'LineString'",
              'halfwidth = (cut.bounds[3]-cut.bounds[1])/2',
              "check(key+f'_L{layer}_smooth_first_stage_{distance}',",
              '      cut.geom_type==kind and abs(halfwidth-expected)<.0021,',
              '      measured_halfwidth_um=halfwidth, expected_halfwidth_um=expected)',
              'if split:',
              '    spans=sorted((g.bounds[1],g.bounds[3]) for g in cut.geoms)',
              '    gap=spans[1][0]-spans[0][1]',
              "    check(key+f'_L2_original_entrance_gap_{distance}',",
              '          len(spans)==2 and abs(gap-5*(1-f))<.0021,',
              '          gap_um=gap, expected_gap_um=5*(1-f))'])
          assert text.count(old)==1
          patched=text.replace(old,new,1)
          ast.parse(patched)
          p.write_text(patched)
          PY
      - name: Install independent geometry inspection libraries
        run: python -m pip install numpy==2.4.6 shapely matplotlib
      - name: Audit all nine starts full masks and unchanged optical geometry
        run: python validate_2611_release_offset.py --baseline baseline/comparison.gds --render
      - name: Verify negative control untouched files and output hash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,shutil,tempfile
          from validate_2611_release_offset import validate,STEM
          with tempfile.TemporaryDirectory() as temp:
              root=Path(temp);(root/'gds').mkdir()
              shutil.copy2('baseline/comparison.gds',root/'gds'/(STEM+'.gds'))
              try:
                  validate(root)
              except AssertionError as exc:
                  assert 'starts_exactly_at_L10' in str(exc),str(exc)
              else:
                  raise AssertionError('Negative control incorrectly accepted former setback')
          protected=json.loads(Path('baseline/protected.json').read_text())
          assert all(hashlib.sha256(Path(p).read_bytes()).hexdigest()==h for p,h in protected.items())
          assert hashlib.sha256(Path('gds/'+STEM+'.gds').read_bytes()).hexdigest()=='c82536e2dbe467fc8f3d8e3c5586371353593bc8e027a47c69969f1d9775ffc4'
          report=Path('gds/2611_release_offset_validation.json')
          data=json.loads(report.read_text())
          data.update(base_commit='1683db53f6184134710859ce3375e5f77573ed80',
              protected_unrelated_file_count=len(protected),unrelated_files_unchanged=True,
              negative_control_rejects_previous_10um_setback=True,
              builder_numeric_change='Only RELEASE_WINDOW_START_OFFSET changes from 10.0 to 0.0; both margins remain 1.0',
              generated_GDS_bytes_unchanged=True,generation_run_id=42464464443,
              entrance_check_note='Layer 2 retains its original two side bands before the 0.5 um delayed slab copy; validation measures their outer span and preserved center gap. No geometry changed to satisfy the corrected expectation.')
          report.write_text(json.dumps(data,indent=2))
          print('PASS:',len(protected),'unrelated files unchanged; previous setback rejected')
          PY
      - name: Upload checked source GDS and entrance previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 2611-L6000-common-start-verified
          path: |
            2611_design1_L6000_straight_output.py
            2611_design1_L6000_P10_width_sweep.py
            2611_tapered_yue_dual_resist.py
            DESIGN1_STRAIGHT_OUTPUT_README.txt
            validate_2611_release_offset.py
            validate_2611_straight_output_raw.py
            validate_2611_coupler_release.py
            validate_2611_two_coupler_windows.py
            layers.py
            markers.py
            phononics.py
            routing.py
            tapered_local.py
            tether_variants.py
            tether_variants.gds
            text.py
            gds/2611_design1_L6000_P10_straight_output_comparison.*
            gds/2611_design1_L6000_P10_width_sweep.*
            gds/2611_release_offset_validation.json
            validation_2611_release_offset/*.png
      - name: Save passing files and remove temporary migration and workflows
        run: |
          git config user.name 'chatgpt-runner'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 2611_design1_L6000_straight_output.py DESIGN1_STRAIGHT_OUTPUT_README.txt validate_2611_release_offset.py gds/2611_design1_L6000_P10_straight_output_comparison.gds gds/2611_design1_L6000_P10_straight_output_comparison.json gds/2611_release_offset_validation.json
          git rm _apply_2611_common_start.py .github/workflows/verify_2611_common_start.yml .github/workflows/finalize_2611_common_start.yml
          git commit -m 'Restore common Layer 2 Layer 14 and Layer 10 starts with unchanged margins'
          git push
