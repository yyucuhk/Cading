name: Verify narrow-end PNC reinforcement
on:
  push:
    branches: [layout/2611-narrow-end-pnc-correction]
    paths: [.github/workflows/verify_2611_narrow_end.yml]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install approved short-layout geometry engine
        run: python -m pip install gdsfactory==9.45.0 kfactory==2.6.1 klayout==0.30.12 numpy==2.4.6
      - name: Preserve approved outputs before correcting the mistaken location
        run: python validate_2611_taper_pitch.py capture
      - name: Move reinforcement to the narrow endpoint in both source generators
        run: |
          python _relocate_narrow_pnc_once.py
          python -m py_compile 2611_tapered_yue_dual_resist.py 2611_tapered_yue_design2.py 2611_build_combined_sweep.py 2611_design1_L6000_P10_width_sweep.py validate_2611_taper_pitch.py
      - name: Regenerate both standalone designs and the complete 18-device sweep
        run: |
          python 2611_tapered_yue_dual_resist.py
          python 2611_tapered_yue_design2.py
          python 2611_build_combined_sweep.py
      - name: Regenerate long-width sweep with its approved geometry engine
        run: |
          python -m pip install klayout==0.30.13
          python 2611_design1_L6000_P10_width_sweep.py
      - name: Verify complete ends connectivity placement labels and straight PNCs
        run: |
          python validate_2611_combined_sweep.py
          python validate_2611_vertical_sweep.py
          python validate_2611_straight_pitch.py
      - name: Measure all narrow-end stations and exact preservation outside both correction regions
        run: python validate_2611_taper_pitch.py
      - name: Record precise location and reproduction environment
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p = Path('gds/2611_taper_pitch_validation.json')
          report = json.loads(p.read_text())
          assert report['status'] == 'PASS' and not report['failures']
          assert report['dense_start_um'] == 40 and report['dense_end_um'] == 45
          assert report['taper_ends_checked'] == 46
          report['base_commit'] = 'd8493fa51507aee74deb8b7b7a8aacc02ad4041e'
          report['correction'] = 'Move five 1 um periods from wide PNC start to narrow 3 um end; restore normal wide-end pitch'
          report['build_engine_versions'] = {
              'short': {'gdsfactory':'9.45.0','kfactory':'2.6.1','klayout':'0.30.12','numpy':'2.4.6'},
              'long': {'gdsfactory':'9.45.0','kfactory':'2.6.1','klayout':'0.30.13','numpy':'2.4.6'},
          }
          p.write_text(json.dumps(report, indent=2))
          Path('validation_2611_taper_pitch/validation_report.json').write_text(p.read_text())
          print('PASS:', report['check_count'], 'checks over', report['taper_ends_checked'], 'ends')
          PY
      - name: Upload sources corrected GDSs reports and actual-geometry previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 2611-narrow-end-pnc-release
          if-no-files-found: error
          path: |
            2611_tapered_yue_dual_resist.py
            2611_tapered_yue_design2.py
            2611_build_combined_sweep.py
            2611_design1_L6000_P10_width_sweep.py
            validate_2611_taper_pitch.py
            validate_2611_combined_sweep.py
            validate_2611_vertical_sweep.py
            validate_2611_straight_pitch.py
            CAD_EDITING_GUIDE.md
            COMBINED_SWEEP_README.md
            DESIGN1_L6000_WIDTH_SWEEP_README.md
            gds/2611_tapered_yue_dual_resist_L10_L12.gds
            gds/2611_tapered_yue_design2.gds
            gds/2611_design1_design2_L1400_18device_sweep.*
            gds/2611_design1_L6000_P10_width_sweep.*
            gds/2611_*validation.json
            validation_2611_taper_pitch/*.png
            validation_2611_taper_pitch/validation_report.json
            validation_2611_combined_sweep/*.log
            validation_2611_L6000_width_sweep/*.log
      - name: Commit validated output and remove temporary patch runner
        run: |
          git config user.name "chatgpt-runner"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 2611_tapered_yue_dual_resist.py 2611_tapered_yue_design2.py 2611_build_combined_sweep.py 2611_design1_L6000_P10_width_sweep.py
          git add validate_2611_taper_pitch.py CAD_EDITING_GUIDE.md COMBINED_SWEEP_README.md DESIGN1_L6000_WIDTH_SWEEP_README.md
          git add gds/2611_tapered_yue_dual_resist_L10_L12.gds gds/2611_tapered_yue_design2.gds
          git add gds/2611_design1_design2_L1400_18device_sweep.gds gds/2611_design1_design2_L1400_18device_sweep.json gds/2611_design1_design2_L1400_18device_sweep.csv
          git add gds/2611_design1_L6000_P10_width_sweep.gds gds/2611_design1_L6000_P10_width_sweep.json gds/2611_design1_L6000_P10_width_sweep.csv
          git add gds/2611_taper_pitch_validation.json gds/2611_combined_sweep_validation.json gds/2611_vertical_sweep_validation.json gds/2611_straight_pitch_validation.json
          git rm _relocate_narrow_pnc_once.py .github/workflows/verify_2611_narrow_end.yml
          git commit -m "Relocate dense PNC reinforcement to narrow 3 um end and restore wide-end spacing"
          git push origin HEAD:layout/2611-narrow-end-pnc-correction
